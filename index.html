<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>STOCKLOSS BSD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--glass:rgba(255,255,255,.12);
--glass-border:rgba(255,255,255,.16);
--white:#ffffff;
--soft:#dbe4ff;
--cyan:#25e8ff;
--purple:#7c3aed;
--shadow:0 20px 50px rgba(0,0,0,.35);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
min-height:100%;
overscroll-behavior:none;
}

body{

min-height:100dvh;
display:flex;
justify-content:center;
align-items:center;

padding:
max(20px,env(safe-area-inset-top))
20px
max(20px,env(safe-area-inset-bottom));

position:relative;
overflow:hidden;

background:
linear-gradient(
rgba(8,12,20,.68),
rgba(8,12,20,.74)
),
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png');

background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;

}

/* GLOW */

body::before{
content:'';
position:absolute;
width:420px;
height:420px;
top:-140px;
left:-140px;
border-radius:50%;
background:#00f5ff;
filter:blur(120px);
opacity:.18;
animation:float1 8s ease-in-out infinite;
}

body::after{
content:'';
position:absolute;
width:380px;
height:380px;
bottom:-140px;
right:-140px;
border-radius:50%;
background:#7c3aed;
filter:blur(120px);
opacity:.20;
animation:float2 9s ease-in-out infinite;
}

@keyframes float1{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(18px);
}
}

@keyframes float2{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-20px);
}
}

/* CONTAINER */

.container{

position:relative;
z-index:10;

width:100%;
max-width:470px;

padding:38px 28px;

border-radius:34px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(24px);
-webkit-backdrop-filter:blur(24px);

border:1px solid rgba(255,255,255,.12);

box-shadow:
0 10px 30px rgba(0,0,0,.25),
0 0 0 1px rgba(255,255,255,.04) inset;

overflow:hidden;

}

/* GLASS EFFECT */

.container::before{
content:'';
position:absolute;
inset:0;
background:
linear-gradient(
135deg,
rgba(255,255,255,.16),
rgba(255,255,255,.03)
);
pointer-events:none;
}

.logo{

position:relative;
z-index:2;

width:92px;
height:92px;

margin:auto;
margin-bottom:24px;

border-radius:28px;

display:flex;
justify-content:center;
align-items:center;

font-size:42px;

background:
linear-gradient(
135deg,
#00f5ff,
#3b82f6,
#7c3aed
);

box-shadow:
0 10px 25px rgba(0,245,255,.25);

color:white;

animation:logoFloat 4s ease-in-out infinite;

}

@keyframes logoFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-6px);
}
}

h1{

position:relative;
z-index:2;

text-align:center;
font-size:32px;
font-weight:800;

background:
linear-gradient(
90deg,
#ffffff,
#dbeafe,
#ffffff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

margin-bottom:8px;
letter-spacing:.5px;

}

.desc{

position:relative;
z-index:2;

text-align:center;
font-size:14px;
line-height:1.6;

color:rgba(255,255,255,.72);

margin-bottom:34px;

}

/* INPUT */

.input-box{
position:relative;
margin-bottom:22px;
z-index:5;
}

.input-box label{
display:block;
margin-bottom:10px;
font-size:14px;
font-weight:500;
color:rgba(255,255,255,.88);
}

.input-box input{

width:100%;

height:62px;

padding:0 20px;

border-radius:20px;

border:1px solid rgba(255,255,255,.08);

background:
linear-gradient(
135deg,
rgba(255,255,255,.09),
rgba(255,255,255,.04)
);

color:white;

font-size:16px;
font-weight:500;

outline:none;

transition:.25s;

backdrop-filter:blur(10px);

}

.input-box input:focus{

border:1px solid rgba(0,245,255,.55);

box-shadow:
0 0 0 4px rgba(0,245,255,.10),
0 0 20px rgba(0,245,255,.18);

transform:translateY(-1px);

}

.input-box input::placeholder{
color:rgba(255,255,255,.38);
}

/* BUTTON */

button{

width:100%;
height:60px;

border:none;
border-radius:20px;

font-size:17px;
font-weight:700;

cursor:pointer;

transition:.25s;

color:white;

position:relative;
overflow:hidden;

}

button::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.25),
transparent
);
transition:.7s;
}

button:hover::before{
left:100%;
}

button:active{
transform:scale(.98);
}

#btnKirim{

background:
linear-gradient(
135deg,
#00eaff,
#4f7cff,
#7c3aed
);

box-shadow:
0 10px 25px rgba(59,130,246,.35);

}

.reset-btn{

margin-top:14px;

background:
linear-gradient(
135deg,
#ff4d4d,
#ef4444,
#dc2626
);

box-shadow:
0 10px 25px rgba(239,68,68,.28);

}

/* STATUS */

#status{

margin-top:22px;

text-align:center;

font-size:14px;
font-weight:500;

color:#ffffff;

min-height:22px;

}

/* DROPDOWN */

#suggestions{

position:absolute;

top:105%;
left:0;

width:100%;

max-height:320px;

overflow-y:auto;

background:rgba(10,15,25,.95);

backdrop-filter:blur(20px);

border-radius:20px;

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 20px 40px rgba(0,0,0,.45);

z-index:999;

padding:8px;

}

/* ITEM */

.suggest-item{

padding:16px;

border-radius:16px;

cursor:pointer;

transition:.2s;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

text-align:center;

margin-bottom:6px;

}

.suggest-item:last-child{
margin-bottom:0;
}

.suggest-item:hover{

background:
linear-gradient(
135deg,
rgba(0,245,255,.12),
rgba(124,58,237,.12)
);

}

.suggest-barcode{

font-size:14px;
font-weight:700;

color:#25e8ff;

}

.suggest-name{

margin-top:6px;

font-size:13px;
line-height:1.5;

color:rgba(255,255,255,.78);

}

/* SCROLL */

#suggestions::-webkit-scrollbar{
width:6px;
}

#suggestions::-webkit-scrollbar-thumb{
background:rgba(255,255,255,.18);
border-radius:20px;
}

/* MOBILE */

@media(max-width:600px){

body{
align-items:flex-start;
}

.container{

margin-top:20px;

max-width:100%;

padding:34px 22px;

border-radius:28px;

}

h1{
font-size:28px;
}

.logo{
width:84px;
height:84px;
font-size:38px;
}

.input-box input{
height:58px;
font-size:15px;
}

button{
height:58px;
font-size:16px;
}

}

/* DESKTOP */

@media(min-width:1200px){

.container{
max-width:500px;
padding:42px 34px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="logo">🐷</div>

<h1>STOCKLOSS BSD</h1>

<p class="desc">
Input Barcode dan Qty Stockloss
dengan tampilan modern glassmorphism
</p>

<div class="input-box">

<label>Barcode</label>

<input
type="text"
id="barcode"
placeholder="Scan / Input Barcode"
autocomplete="off"
/>

<div id="suggestions"></div>

</div>

<div class="input-box">

<label>Qty</label>

<input
type="text"
inputmode="decimal"
id="qty"
placeholder="Masukkan Qty"
/>

</div>

<button id="btnKirim" onclick="kirimData()">
Kirim Data
</button>

<button onclick="resetData()" class="reset-btn">
Reset Sheet SLT
</button>

<div id="status"></div>

</div>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyYp-CRc2wUKF-OQ8VFb3NApejjOSpIDbdlVxcsvgDtY8YHEwGdysxaHU1ruQATXOIS-w/exec";

const ADMIN_PASSWORD = "00";

let barcodeCache = [];
let debounceTimer;

/* FULL HEIGHT FIX IOS */
function setRealHeight(){

document.documentElement.style.setProperty(
'--vh',
window.innerHeight * 0.01 + 'px'
);

}

setRealHeight();

window.addEventListener(
'resize',
setRealHeight
);

/* AUTO FOCUS */
window.onload = async () => {

document.getElementById("barcode").focus();

await loadBarcodeData();

};

/* LOAD BARCODE */
async function loadBarcodeData(){

try{

const res = await fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({
action:"getAllBarcode"
})

});

barcodeCache = await res.json();

console.log(
"Loaded:",
barcodeCache.length
);

}catch(err){

console.log(err);

}

}

/* AUTO QTY */
document
.getElementById("barcode")
.addEventListener("input", function(){

let barcode = this.value.trim();

if(
barcode.startsWith("20") &&
barcode.length === 13 &&
/^\d+$/.test(barcode)
){

let qtyRaw =
barcode.substring(7,12);

let qtyNumber =
parseInt(qtyRaw,10) / 1000;

let qtyFormatted =
qtyNumber
.toFixed(3)
.replace(/\.?0+$/,'');

qtyFormatted =
qtyFormatted.replace(".",",");

document.getElementById("qty").value =
qtyFormatted;

}

});

/* AUTOCOMPLETE */
document
.getElementById("barcode")
.addEventListener("input", function(e){

e.stopPropagation();

clearTimeout(debounceTimer);

debounceTimer = setTimeout(() => {

let keyword =
this.value.trim().toLowerCase();

const suggestions =
document.getElementById("suggestions");

if(keyword.length < 2){

suggestions.innerHTML = "";
return;

}

let filtered = barcodeCache.filter(item => {

let barcode =
String(item.barcode).toLowerCase();

let nama =
String(item.nama).toLowerCase();

return (

barcode.startsWith(keyword) ||

barcode.includes(keyword) ||

nama.includes(keyword)

);

});

filtered.sort((a,b)=>{

let aBarcode =
String(a.barcode).toLowerCase();

let bBarcode =
String(b.barcode).toLowerCase();

if(aBarcode === keyword) return -1;
if(bBarcode === keyword) return 1;

if(aBarcode.startsWith(keyword) &&
!bBarcode.startsWith(keyword)) return -1;

if(bBarcode.startsWith(keyword) &&
!aBarcode.startsWith(keyword)) return 1;

return aBarcode.length - bBarcode.length;

});

if(filtered.length === 0){

suggestions.innerHTML = "";
return;

}

filtered = filtered.slice(0,20);

let html = "";

filtered.forEach(item => {

html += `

<div class="suggest-item"
onclick="pilihBarcode('${item.barcode}')">

<div class="suggest-barcode">
${item.barcode}
</div>

<div class="suggest-name">
${item.nama}
</div>

</div>

`;

});

suggestions.innerHTML = html;

},120);

});

/* HIDE */
document.addEventListener("click",function(e){

if(!e.target.closest(".input-box")){

document.getElementById("suggestions").innerHTML =
"";

}

});

/* PILIH */
function pilihBarcode(barcode){

document.getElementById("barcode").value =
barcode;

document.getElementById("suggestions").innerHTML =
"";

document.getElementById("qty").focus();

}

/* ENTER */

document.getElementById("barcode")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

e.preventDefault();

document.getElementById("qty").focus();

}

});

document.getElementById("qty")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

e.preventDefault();

kirimData();

}

});

/* KIRIM */

async function kirimData(){

let barcode =
document.getElementById("barcode").value.trim();

let qty =
document.getElementById("qty").value.trim();

qty = qty.replace(",", ".");

let btn =
document.getElementById("btnKirim");

if(barcode === "" || qty === ""){

document.getElementById("status").innerHTML =
"⚠️ Barcode dan Qty wajib diisi";

return;

}

btn.disabled = true;
btn.innerHTML = "⏳ Mengirim...";

document.getElementById("barcode").value = "";
document.getElementById("qty").value = "";
document.getElementById("suggestions").innerHTML = "";

document.getElementById("barcode").focus();

document.getElementById("status").innerHTML =
"⏳ Mengirim data...";

try{

await fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

barcode:barcode,
qty:qty

})

});

document.getElementById("status").innerHTML =
"✅ Data berhasil dikirim";

}catch(err){

document.getElementById("status").innerHTML =
"❌ Gagal mengirim data";

console.log(err);

}finally{

btn.disabled = false;
btn.innerHTML = "Kirim Data";

}

}

/* RESET */

function resetData(){

let password = prompt(
"Masukkan password admin"
);

if(password === null) return;

if(password !== ADMIN_PASSWORD){

document.getElementById("status").innerHTML =
"❌ Password admin salah";

return;

}

let konfirmasi = confirm(
"Yakin ingin menghapus semua data sheet SLT?"
);

if(!konfirmasi) return;

document.getElementById("status").innerHTML =
"⏳ Menghapus data...";

fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"reset",
password:password

})

})

.then(res => res.text())

.then(data => {

document.getElementById("status").innerHTML =
"✅ Semua data sheet SLT berhasil dihapus";

document.getElementById("barcode").focus();

})

.catch(err => {

document.getElementById("status").innerHTML =
"❌ Gagal reset data";

console.log(err);

});

}

</script>

</body>
</html>
