<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Bear Login</title>
  <!-- Load Rive Web Canvas SDK -->
  <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
  <style>
    body {
      background-color: #dce5eb;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      background: #ffffff;
      padding: 20px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 320px;
      text-align: center;
    }
    #canvas {
      width: 250px;
      height: 250px;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .btn-login {
      width: 100%;
      padding: 10px;
      background-color: #b71c1c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Canvas untuk menampilkan animasi Rive -->
    <canvas id="canvas"></canvas>

    <form id="loginForm">
      <div class="input-group">
        <input type="email" id="email" placeholder="Email/Username" autocomplete="off" />
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" />
      </div>
      <button type="submit" class="btn-login">Login</button>
    </form>
  </div>

  <script>
    let isCheckingInput, isCoveringEyesInput, numLookInput, trigSuccessInput, trigFailInput;

    // Inisialisasi Rive State Machine
    const r = new rive.Rive({
      src: "animated_bear.riv", // File .riv dari Rive Community
      canvas: document.getElementById("canvas"),
      autoplay: true,
      stateMachines: "State Machine 1",
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        const inputs = r.stateMachineInputs("State Machine 1");
        
        // Ambil pemicu (Inputs) dari Rive State Machine
        isCheckingInput = inputs.find(i => i.name === 'isChecking');
        isCoveringEyesInput = inputs.find(i => i.name === 'isHandsUp');
        numLookInput = inputs.find(i => i.name === 'numLook');
        trigSuccessInput = inputs.find(i => i.name === 'trigSuccess');
        trigFailInput = inputs.find(i => i.name === 'trigFail');
      },
    });

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    // Efek Beruang Melihat Karakter yang Diketik
    emailInput.addEventListener("focus", () => {
      if (isCheckingInput) isCheckingInput.value = true;
    });
    emailInput.addEventListener("blur", () => {
      if (isCheckingInput) isCheckingInput.value = false;
    });
    emailInput.addEventListener("input", (e) => {
      if (numLookInput) {
        // Mengubah posisi mata berdasarkan panjang karakter
        numLookInput.value = Math.min(e.target.value.length * 3, 100);
      }
    });

    // Efek Beruang Menutup Mata Saat Ketik Password
    passwordInput.addEventListener("focus", () => {
      if (isCoveringEyesInput) isCoveringEyesInput.value = true;
    });
    passwordInput.addEventListener("blur", () => {
      if (isCoveringEyesInput) isCoveringEyesInput.value = false;
    });

    // Efek Beruang Respons Login (Sukses / Gagal)
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if (emailInput.value && passwordInput.value) {
        if (trigSuccessInput) trigSuccessInput.fire();
      } else {
        if (trigFailInput) trigFailInput.fire();
      }
    });
  </script>
</body>
</html>
