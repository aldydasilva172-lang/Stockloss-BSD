<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STOCKLOSS BSD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html,body{
overscroll-behavior:none;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

background:
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png')
center center / cover no-repeat fixed;

overflow:hidden;
}

/* LOGIN OVERLAY */
.login-overlay{
position:fixed;
inset:0;

display:flex;
justify-content:center;
align-items:center;

z-index:9999999999;

background:
linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.65)
),
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png')
center center / cover no-repeat;

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
}

/* LOGIN BOX */
.login-box{
width:90%;
max-width:360px;

padding:30px;

border-radius:28px;

background:
linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.45)
),
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png')
center center / cover no-repeat;

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

box-shadow:
0 0 20px rgba(0,245,255,.25),
0 0 40px rgba(124,58,237,.20),
0 15px 35px rgba(0,0,0,.45);

animation:popup .25s ease;
}

.login-title{
text-align:center;

font-size:24px;
font-weight:700;

color:white;

margin-bottom:10px;

text-shadow:
0 0 10px rgba(0,245,255,.45),
0 2px 8px rgba(0,0,0,.8);
}

.login-desc{
text-align:center;

font-size:13px;

color:#cbd5e1;

margin-bottom:22px;

line-height:1.5;
}

.login-input{
width:100%;

padding:16px;

border:none;
outline:none;

border-radius:18px;

background:rgba(0,0,0,.35);

color:white;

font-size:16px;

border:1px solid rgba(255,255,255,.08);

margin-bottom:18px;

transition:.3s;
}

.login-input:focus{

border:1px solid rgba(0,245,255,.7);

background:rgba(0,0,0,.45);

box-shadow:
0 0 12px rgba(0,245,255,.35),
0 0 25px rgba(124,58,237,.20);

}

.login-btn{
width:100%;
}

/* CONTAINER */
.container{
position:relative;
z-index:1;

overflow:visible;

width:100%;
max-width:430px;
padding:35px;
border-radius:28px;

background:transparent;
}

/* LOGO */
.logo{
width:85px;
height:85px;

margin:auto;
margin-bottom:22px;

border-radius:26px;

display:flex;
justify-content:center;
align-items:center;

font-size:38px;
font-weight:700;

color:white;

background:
linear-gradient(
rgba(0,0,0,.25),
rgba(0,0,0,.25)
),
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png')
center center / cover no-repeat;

border:1px solid rgba(255,255,255,.10);

backdrop-filter:blur(8px);

box-shadow:
0 0 20px rgba(0,245,255,.20),
0 8px 20px rgba(0,0,0,.35);

text-shadow:
0 2px 8px rgba(0,0,0,.8);
}

h1{
text-align:center;
font-size:30px;
font-weight:700;
margin-bottom:8px;

color:white;

text-shadow:
0 0 10px rgba(0,245,255,.7),
0 0 20px rgba(124,58,237,.5),
0 2px 8px rgba(0,0,0,.8);

letter-spacing:1px;
}

.desc{
text-align:center;
font-size:14px;

color:#7dd3fc;

margin-bottom:30px;

text-shadow:
0 0 8px rgba(56,189,248,.5),
0 0 18px rgba(14,165,233,.35);

letter-spacing:.5px;
}

/* INPUT BOX */
.input-box{
margin-bottom:20px;
position:relative;

background:rgba(0,0,0,.12);

border-radius:22px;

padding:14px;

backdrop-filter:blur(4px);
-webkit-backdrop-filter:blur(4px);

box-shadow:
0 0 20px rgba(0,245,255,.25),
0 0 40px rgba(124,58,237,.20),
0 15px 35px rgba(0,0,0,.45);

overflow:visible;

isolation:isolate;

transform:translateZ(0);
will-change:transform;
}

.input-box:first-of-type{
z-index:999999;
}

.input-box:nth-of-type(2){
z-index:1;
}

.input-box label{
display:block;
margin-bottom:8px;

font-size:14px;
font-weight:600;

color:white;

text-shadow:
0 2px 8px rgba(0,0,0,.7),
0 0 8px rgba(0,245,255,.35);

letter-spacing:.5px;
}

.input-box input{
width:100%;
padding:16px;

border:none;
outline:none;

border-radius:16px;

border:1px solid rgba(255,255,255,.08);

background:rgba(0,0,0,.25);

color:white;

font-size:15px;
font-weight:500;

backdrop-filter:blur(6px);

transition:.3s;

box-shadow:
0 4px 12px rgba(0,0,0,.25);
}

.input-box input:focus{

border:1px solid rgba(0,245,255,.7);

background:rgba(0,0,0,.35);

box-shadow:
0 0 12px rgba(0,245,255,.35),
0 0 25px rgba(124,58,237,.20),
0 4px 15px rgba(0,0,0,.35);

transform:scale(1.01);

}

input::placeholder{
color:rgba(219,234,254,.55);

text-shadow:
0 0 6px rgba(0,245,255,.18);

letter-spacing:.4px;
}

/* STATUS */
#status{

margin-top:18px;

text-align:center;

font-size:14px;

font-weight:500;

color:rgba(255,255,255,.88);

min-height:20px;

text-shadow:
0 2px 8px rgba(0,0,0,.75),
0 0 10px rgba(0,245,255,.15);

letter-spacing:.3px;

}

/* DROPDOWN FIX */
#suggestions{
position:absolute;

top:calc(100% + 8px);
left:0;
right:0;

max-height:320px;
overflow-y:auto;

z-index:9999999;

display:none;

background:
linear-gradient(
rgba(0,0,0,.55),
rgba(0,0,0,.55)
),
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png')
center center / cover no-repeat;

backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);

border-radius:18px;

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 10px 25px rgba(0,0,0,.35);

-webkit-overflow-scrolling:touch;

transform:translateZ(999px);
}

.suggest-item{
padding:16px 20px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
transition:.2s;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

text-align:center;
}

.suggest-item:last-child{
border-bottom:none;
}

.suggest-item:hover{
background:rgba(255,255,255,.08);
}

.suggest-barcode{
font-size:14px;
font-weight:700;
color:#00f5ff;
}

.suggest-name{
font-size:13px;
color:#cbd5e1;
margin-top:4px;
line-height:1.4;
}

/* BUTTON */
button{
width:100%;
padding:16px;

border:none;
border-radius:18px;

background:
linear-gradient(
rgba(0,0,0,.20),
rgba(0,0,0,.20)
),
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png')
center center / cover no-repeat;

color:white;

font-size:16px;
font-weight:600;

cursor:pointer;

transition:.3s;

border:1px solid rgba(255,255,255,.10);

backdrop-filter:blur(6px);

box-shadow:
0 6px 18px rgba(0,0,0,.35),
0 0 15px rgba(0,245,255,.12);

text-shadow:
0 2px 8px rgba(0,0,0,.8);

letter-spacing:.5px;
}

button:hover{

transform:
translateY(-2px)
scale(1.01);

box-shadow:
0 10px 25px rgba(0,0,0,.45),
0 0 20px rgba(0,245,255,.20);

filter:brightness(1.05);

}

.reset-btn{
margin-top:12px;
}

</style>
</head>
<body>

<div class="container">

<div class="logo">☠️</div>

<h1>STOCKLOSS BSD</h1>

<p class="desc">
Scan / Input Barcode dan Qty
</p>

<div class="input-box">

<label>Barcode</label>

<input 
type="text" 
id="barcode" 
placeholder="Scan / Input Barcode"
autocomplete="off"
>

<div id="suggestions"></div>

</div>

<div class="input-box">

<label>Qty</label>

<input 
type="text"
inputmode="decimal"
id="qty" 
placeholder="Masukkan Qty"
>

</div>

<button id="btnKirim">
Kirim Data
</button>

<button class="reset-btn">
Reset Data Stockloss
</button>

<div id="status"></div>

</div>

<script>

let barcodeCache = [
{
barcode:"8991234567890",
nama:"Indomie Goreng"
},
{
barcode:"8999876543210",
nama:"Teh Botol"
},
{
barcode:"8991111111111",
nama:"Silverqueen"
}
];

let debounceTimer;

/* HIDE DROPDOWN */
function hideSuggestions(){

const suggestions =
document.getElementById("suggestions");

suggestions.innerHTML = "";
suggestions.style.display = "none";

}

/* AUTOCOMPLETE */
document
.getElementById("barcode")
.addEventListener("input", function(e){

e.stopPropagation();

clearTimeout(debounceTimer);

debounceTimer = setTimeout(() => {

let keyword =
this.value.trim().toLowerCase();

const suggestions =
document.getElementById("suggestions");

if(keyword.length < 2){

suggestions.innerHTML = "";
suggestions.style.display = "none";

return;

}

let filtered = barcodeCache.filter(item => {

let barcode =
String(item.barcode).toLowerCase();

let nama =
String(item.nama).toLowerCase();

return (

barcode.startsWith(keyword) ||

barcode.includes(keyword) ||

nama.includes(keyword)

);

});

filtered = filtered.slice(0,20);

let html = "";

filtered.forEach(item => {

html += `

<div class="suggest-item"
onclick="pilihBarcode('${item.barcode}')">

<div class="suggest-barcode">
${item.barcode}
</div>

<div class="suggest-name">
${item.nama}
</div>

</div>

`;

});

suggestions.innerHTML = html;

suggestions.style.display =
html ? "block" : "none";

},120);

});

/* PILIH BARCODE */
function pilihBarcode(barcode){

document.getElementById("barcode").value =
barcode;

hideSuggestions();

document.getElementById("qty").focus();

}

/* HIDE SAAT FOCUS QTY */
document.getElementById("qty")
.addEventListener("focus",function(){

hideSuggestions();

});

/* HIDE CLICK LUAR */
document.addEventListener("click",function(e){

if(!e.target.closest(".input-box")){

hideSuggestions();

}

});

</script>

</body>
</html>
