<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STOCKLOSS BSD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:
linear-gradient(135deg,#0f172a,#111827,#1e293b);
overflow:hidden;
}

/* BACKGROUND EFFECT */
body::before{
content:'';
position:absolute;
width:350px;
height:350px;
background:#00f5ff;
border-radius:50%;
top:-120px;
left:-120px;
filter:blur(120px);
opacity:.25;
}

body::after{
content:'';
position:absolute;
width:300px;
height:300px;
background:#7c3aed;
border-radius:50%;
bottom:-120px;
right:-120px;
filter:blur(120px);
opacity:.25;
}

/* CARD */
.container{
position:relative;
z-index:2;
width:100%;
max-width:430px;
padding:35px;
border-radius:28px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.1);
box-shadow:
0 10px 40px rgba(0,0,0,.35);
animation:fade .7s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* LOGO */
.logo{
width:85px;
height:85px;
margin:auto;
margin-bottom:22px;
border-radius:24px;
display:flex;
justify-content:center;
align-items:center;
font-size:38px;
background:linear-gradient(135deg,#00f5ff,#7c3aed);
color:white;
font-weight:700;
box-shadow:0 10px 30px rgba(0,245,255,.25);
}

/* TITLE */
h1{
text-align:center;
color:white;
font-size:30px;
font-weight:700;
margin-bottom:8px;
}

.desc{
text-align:center;
font-size:14px;
color:#cbd5e1;
margin-bottom:30px;
}

/* INPUT */
.input-box{
margin-bottom:20px;
position:relative;
}

.input-box label{
display:block;
margin-bottom:8px;
font-size:14px;
color:#f1f5f9;
}

.input-box input{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:16px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
border:1px solid transparent;
transition:.3s;
}

.input-box input:focus{
border:1px solid #00f5ff;
box-shadow:0 0 15px rgba(0,245,255,.25);
}

input::placeholder{
color:#94a3b8;
}

/* BUTTON */
button{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#00f5ff,#7c3aed);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(124,58,237,.35);
}

button:active{
transform:scale(.98);
}

/* RESET BUTTON */
.reset-btn{
margin-top:12px;
background:linear-gradient(135deg,#ef4444,#dc2626);
}

.reset-btn:hover{
box-shadow:0 10px 25px rgba(239,68,68,.35);
}

/* STATUS */
#status{
margin-top:18px;
text-align:center;
font-size:14px;
color:#cbd5e1;
}

/* SUGGESTION */
#suggestions{
position:absolute;
top:100%;
left:0;
width:100%;
max-height:220px;
overflow-y:auto;
background:#0f172a;
border-radius:14px;
margin-top:6px;
z-index:99;
box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.suggest-item{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
transition:.2s;
}

.suggest-item:hover{
background:rgba(255,255,255,.08);
}

.suggest-barcode{
font-size:14px;
font-weight:600;
color:#00f5ff;
}

.suggest-name{
font-size:12px;
color:#cbd5e1;
margin-top:2px;
}

/* MOBILE */
@media(max-width:500px){

.container{
padding:28px;
border-radius:24px;
}

h1{
font-size:24px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="logo">📦</div>

<h1>STOCKLOSS BSD</h1>

<p class="desc">
Input barcode dan qty stockloss
</p>

<div class="input-box">

<label>Barcode</label>

<input 
type="text" 
id="barcode" 
placeholder="Scan / input barcode"
autocomplete="off"
>

<div id="suggestions"></div>

</div>

<div class="input-box">

<label>Qty</label>

<input 
type="number" 
id="qty" 
placeholder="Masukkan qty"
>

</div>

<button onclick="kirimData()">
Kirim Data
</button>

<button onclick="resetData()" class="reset-btn">
Reset Sheet SLT
</button>

<div id="status"></div>

</div>

<script>

/* URL APPS SCRIPT */
const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyYp-CRc2wUKF-OQ8VFb3NApejjOSpIDbdlVxcsvgDtY8YHEwGdysxaHU1ruQATXOIS-w/exec";

/* PASSWORD ADMIN */
const ADMIN_PASSWORD = "00";

/* AUTO FOCUS */
window.onload = () => {
document.getElementById("barcode").focus();
};

/* AUTOCOMPLETE BARCODE */
document
.getElementById("barcode")
.addEventListener("input", function(){

let keyword = this.value.trim();

if(keyword.length < 3){

document.getElementById("suggestions").innerHTML = "";
return;

}

fetch(URL_SCRIPT,{

method:"POST",

body:JSON.stringify({

action:"search",
keyword:keyword

})

})

.then(res => res.json())

.then(data => {

let html = "";

data.forEach(item => {

html += `
<div class="suggest-item"
onclick="pilihBarcode('${item.barcode}')">

<div class="suggest-barcode">
${item.barcode}
</div>

<div class="suggest-name">
${item.nama}
</div>

</div>
`;

});

document.getElementById("suggestions").innerHTML =
html;

})

.catch(err => {

document.getElementById("suggestions").innerHTML = "";

});

});

/* PILIH BARCODE */
function pilihBarcode(barcode){

document.getElementById("barcode").value =
barcode;

document.getElementById("suggestions").innerHTML =
"";

document.getElementById("qty").focus();

}

/* ENTER PINDAH INPUT */
document.getElementById("barcode")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){
e.preventDefault();
document.getElementById("qty").focus();
}

});

/* ENTER KIRIM */
document.getElementById("qty")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){
e.preventDefault();
kirimData();
}

});

/* KIRIM DATA */
function kirimData(){

let barcode =
document.getElementById("barcode").value.trim();

let qty =
document.getElementById("qty").value.trim();

if(barcode === "" || qty === ""){

document.getElementById("status").innerHTML =
"⚠️ Barcode dan Qty wajib diisi";

return;

}

document.getElementById("status").innerHTML =
"⏳ Mengirim data...";

fetch(URL_SCRIPT,{

method:"POST",

body:JSON.stringify({

barcode:barcode,
qty:qty

})

})

.then(res => res.text())

.then(data => {

document.getElementById("status").innerHTML =
"✅ Data berhasil dikirim";

document.getElementById("barcode").value = "";
document.getElementById("qty").value = "";

document.getElementById("suggestions").innerHTML =
"";

document.getElementById("barcode").focus();

})

.catch(err => {

document.getElementById("status").innerHTML =
"❌ Gagal mengirim data";

});

}

/* RESET DATA */
function resetData(){

let password = prompt(
"Masukkan password admin"
);

if(password === null) return;

if(password !== ADMIN_PASSWORD){

document.getElementById("status").innerHTML =
"❌ Password admin salah";

return;

}

let konfirmasi = confirm(
"Yakin ingin menghapus semua data sheet SLT?"
);

if(!konfirmasi) return;

document.getElementById("status").innerHTML =
"⏳ Menghapus data...";

fetch(URL_SCRIPT,{

method:"POST",

body:JSON.stringify({

action:"reset",
password:password

})

})

.then(res => res.text())

.then(data => {

document.getElementById("status").innerHTML =
"✅ Semua data sheet SLT berhasil dihapus";

document.getElementById("barcode").value = "";
document.getElementById("qty").value = "";

document.getElementById("barcode").focus();

})

.catch(err => {

document.getElementById("status").innerHTML =
"❌ Gagal reset data";

});

}

</script>

</body>
</html>
