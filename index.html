<html lang="id">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html, body{
width:100%;
min-height:100%;
margin:0;
padding:0;
overscroll-behavior:none;
-webkit-text-size-adjust:100%;
}

body{
min-height:100dvh;
min-height:-webkit-fill-available;

padding:20px;

position:relative;

background:
linear-gradient(
rgba(0,0,0,.60),
rgba(0,0,0,.60)
),
url('232c59a2-a76c-4766-8c58-20a6e1b7550a.jpeg')
center top / 100% auto repeat-y;

overflow-x:hidden;
overflow-y:auto;

display:block;
}

/* ================================================= */
/* LOGIN SCREEN - ONLY LOGIN DESIGN */
/* ================================================= */

.login-overlay{
position:fixed;
inset:0;

display:flex;
justify-content:center;
align-items:center;

z-index:9999999999;

background:
linear-gradient(
rgba(0,0,0,.78),
rgba(0,0,0,.88)
),
url('232c59a2-a76c-4766-8c58-20a6e1b7550a.jpeg')
center center / cover no-repeat;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

padding:20px;
overflow:auto;
}


/* LOGIN CARD */

.login-box{

width:100%;
max-width:380px;

padding:34px 28px 28px;

position:relative;

border-radius:30px;

background:
linear-gradient(
145deg,
rgba(8,15,25,.88),
rgba(3,7,14,.94)
);

border:1px solid rgba(0,245,255,.25);

box-shadow:
0 0 20px rgba(0,245,255,.12),
0 0 50px rgba(124,58,237,.16),
0 25px 70px rgba(0,0,0,.65);

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

overflow:hidden;

animation:loginAppear .45s cubic-bezier(.2,.8,.2,1);
}


/* CAHAYA ATAS CARD */

.login-box::before{

content:"";

position:absolute;

top:-80px;
left:50%;

width:220px;
height:140px;

transform:translateX(-50%);

background:
radial-gradient(
circle,
rgba(0,245,255,.20),
transparent 70%
);

pointer-events:none;
}


/* GARIS NEON */

.login-box::after{

content:"";

position:absolute;

top:0;
left:15%;
right:15%;

height:1px;

background:
linear-gradient(
90deg,
transparent,
rgba(0,245,255,.8),
rgba(124,58,237,.8),
transparent
);

box-shadow:
0 0 12px rgba(0,245,255,.7);

}


/* TITLE */

.login-title{

position:relative;

text-align:center;

font-size:25px;
font-weight:700;

letter-spacing:1.5px;

color:#fff;

margin-bottom:7px;

text-shadow:
0 0 8px rgba(0,245,255,.7),
0 0 20px rgba(0,245,255,.25);

}


/* SUBTITLE */

.login-desc{

text-align:center;

font-size:12px;

font-weight:400;

color:rgba(203,213,225,.75);

margin-bottom:28px;

line-height:1.5;

}


/* PASSWORD INPUT */

.login-input{

width:100%;

height:54px;

padding:0 17px;

border:none;
outline:none;

border-radius:17px;

background:
rgba(0,0,0,.42);

border:1px solid rgba(255,255,255,.10);

color:white;

font-size:15px;

font-family:'Poppins',sans-serif;

box-shadow:
inset 0 0 15px rgba(0,0,0,.25);

transition:
border-color .25s ease,
box-shadow .25s ease,
background .25s ease;

margin-bottom:15px;
}


.login-input::placeholder{

color:rgba(203,213,225,.45);

}


.login-input:focus{

background:
rgba(0,10,18,.55);

border-color:
rgba(0,245,255,.65);

box-shadow:
0 0 12px rgba(0,245,255,.22),
0 0 28px rgba(0,245,255,.10),
inset 0 0 12px rgba(0,245,255,.04);

}


/* LOGIN BUTTON */

.login-btn{

width:100%;

height:54px;

padding:0;

border-radius:17px;

border:1px solid rgba(0,245,255,.45);

background:
linear-gradient(
135deg,
rgba(0,245,255,.16),
rgba(124,58,237,.20)
);

color:white;

font-size:15px;
font-weight:700;

letter-spacing:.7px;

box-shadow:
inset 0 0 18px rgba(0,245,255,.07),
0 0 15px rgba(0,245,255,.16),
0 0 30px rgba(124,58,237,.10);

}


/* LOGIN BUTTON HOVER */

.login-btn:hover{

background:
linear-gradient(
135deg,
rgba(0,245,255,.25),
rgba(124,58,237,.30)
);

border-color:
rgba(0,245,255,.85);

box-shadow:
inset 0 0 20px rgba(0,245,255,.10),
0 0 18px rgba(0,245,255,.40),
0 0 40px rgba(124,58,237,.20);

transform:
translateY(-2px);

}


/* LOGIN BUTTON ACTIVE */

.login-btn:active{

transform:scale(.97);

}


/* LOGIN STATUS */

#loginStatus{

margin-top:14px !important;

text-align:center;

font-size:12px !important;

font-weight:500;

color:#ff6b6b !important;

min-height:18px;

}


/* LOGIN ANIMATION */

@keyframes loginAppear{

0%{
opacity:0;
transform:
translateY(25px)
scale(.94);
}

100%{
opacity:1;
transform:
translateY(0)
scale(1);
}

}


/* MOBILE */

@media(max-width:500px){

.login-overlay{

padding:18px;

}

.login-box{

max-width:370px;

padding:
30px 22px 24px;

border-radius:27px;

}

.login-title{

font-size:22px;

letter-spacing:1.2px;

}

.login-desc{

font-size:11px;

margin-bottom:24px;

}

.login-input,
.login-btn{

height:52px;

}

}

/* CONTAINER */

.container{
position:relative;
z-index:1;

overflow:visible;

width:100%;
max-width:430px;
padding:35px;

border-radius:28px;

background:transparent;
}

h1{
text-align:center;
font-size:40px;
font-weight:700;
margin-bottom:8px;

color:white;

text-shadow:
0 0 10px rgba(0,245,255,.7),
0 0 20px rgba(124,58,237,.5),
0 2px 8px rgba(0,0,0,.8);

letter-spacing:1px;
}

.desc{
text-align:center;
font-size:12px;

color:#f97316;

margin-bottom:30px;

text-shadow:
0 0 8px rgba(56,189,248,.5),
0 0 18px rgba(14,165,233,.35);

letter-spacing:.5px;
}

/* LAST INPUT */

.last-input-box{
display:none;

margin-top:16px;
margin-bottom:8px;

border:1px solid rgba(255,255,255,.08);

background:rgba(0,0,0,.02);

border-radius:22px;

padding:10px 12px;

backdrop-filter:blur(2px);
-webkit-backdrop-filter:blur(2px);

box-shadow:
0 0 14px rgba(0,245,255,.18),
0 0 28px rgba(124,58,237,.25),
0 8px 22px rgba(0,0,0,.32);

}

.last-title{
font-size:15px;
font-weight:600;

color:white;

margin-bottom:6px;

text-shadow:
0 0 10px rgba(0,245,255,.7),
0 0 20px rgba(124,58,237,.5),
0 2px 8px rgba(0,0,0,.8);
}

.history-header{
display:flex;

background:rgba(249,115,22,.20);

border:1px solid rgba(249,115,22,.35);

border-radius:10px 10px 0 0;

font-size:12px;
font-weight:700;

color:#f97316;

margin-bottom:2px;
}

.history-header div:first-child{

padding:8px 10px;

border-right:1px solid rgba(249,115,22,.35);

}

.history-header div:last-child{

}

.history-item{
display:flex;
align-items:center;

border:1px solid rgba(255,255,255,.10);

}

@keyframes historyIn{
from{
opacity:0;
transform:translateY(-5px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.history-nama{
flex:1;

padding:8px 10px;

font-size:13px;
font-weight:600;

color:white;

text-align:left;

border-right:1px solid rgba(255,255,255,.10);

text-shadow:
0 0 5px rgba(0,245,255,.35),
0 1px 4px rgba(0,0,0,.8);
}

.history-qty{
min-width:60px;

padding:8px 10px;

text-align:center;

font-size:12px;
font-weight:700;

color:#f97316;

background:transparent;

text-shadow:
0 0 6px rgba(249,115,22,.35);
}

/* INPUT BOX */

.input-box{
margin-bottom:16px;
position:relative;

border:1px solid rgba(255,255,255,.08);

background:rgba(0,0,0,.12);

border-radius:22px;

padding:14px;

backdrop-filter:blur(4px);
-webkit-backdrop-filter:blur(4px);

box-shadow:
0 0 14px rgba(0,245,255,.18),
0 0 28px rgba(124,58,237,.14),
0 8px 22px rgba(0,0,0,.32);

overflow:visible;
}

.barcode-box{
z-index:9999;
}

.qty-box{
z-index:1;
}

.input-box label{
display:block;

margin-bottom:8px;

font-size:14px;
font-weight:600;

color:white;

text-shadow:
0 2px 8px rgba(0,0,0,.7),
0 0 8px rgba(0,245,255,.35);

letter-spacing:.5px;
}

.input-box input{
width:100%;

padding:16px;

border:none;
outline:none;

border-radius:16px;

border:1px solid rgba(255,255,255,.08);

background:rgba(0,0,0,.25);

color:white;

font-size:15px;
font-weight:500;

backdrop-filter:blur(6px);

transition:.3s;

box-shadow:
0 4px 12px rgba(0,0,0,.25);
}

.input-box input:focus{
border:1px solid rgba(0,245,255,.7);

background:rgba(0,0,0,.35);

box-shadow:
0 0 12px rgba(0,245,255,.35),
0 0 25px rgba(124,58,237,.20),
0 4px 15px rgba(0,0,0,.35);

transform:scale(1.01);
}

input::placeholder{
color:rgba(219,234,254,.55);

text-shadow:
0 0 6px rgba(0,245,255,.18);

letter-spacing:.4px;
}

/* ============================= */
/* BUTTON GLASS NEON */
/* ============================= */

button{

width:100%;
padding:16px;

border:none;
border-radius:18px;

background:
linear-gradient(
135deg,
rgba(0,0,0,.72),
rgba(5,15,25,.62)
);

color:white;

font-size:16px;
font-weight:600;

cursor:pointer;

transition:
transform .25s ease,
box-shadow .25s ease,
border-color .25s ease,
background .25s ease;

border:1px solid rgba(0,245,255,.35);

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

box-shadow:
inset 0 0 15px rgba(0,245,255,.08),
0 0 10px rgba(0,245,255,.18),
0 0 25px rgba(0,245,255,.10),
0 10px 25px rgba(0,0,0,.45);

text-shadow:
0 0 8px rgba(255,255,255,.45),
0 2px 8px rgba(0,0,0,.8);

letter-spacing:.5px;

position:relative;

overflow:hidden;
}


/* CAHAYA DI DALAM TOMBOL */

button::before{

content:"";

position:absolute;

top:0;
left:-120%;

width:70%;
height:100%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.12),
transparent
);

transform:skewX(-20deg);

transition:.5s;

}


/* HOVER */

button:hover{

transform:
translateY(-2px)
scale(1.01);

border-color:
rgba(0,245,255,.75);

background:
linear-gradient(
135deg,
rgba(0,0,0,.80),
rgba(5,20,30,.72)
);

box-shadow:
inset 0 0 20px rgba(0,245,255,.12),
0 0 15px rgba(0,245,255,.45),
0 0 35px rgba(0,245,255,.25),
0 12px 30px rgba(0,0,0,.50);

}

button:hover::before{

left:130%;

}


/* SAAT DITEKAN */

button:active{

transform:
scale(.98);

box-shadow:
inset 0 0 25px rgba(0,245,255,.18),
0 0 20px rgba(0,245,255,.55);

}


/* DISABLED */

button:disabled{

opacity:.6;

cursor:not-allowed;

filter:none;

}


/* ============================= */
/* RESET BUTTON */
/* ============================= */

.reset-btn{

margin-top:12px;

border-color:
rgba(255,60,60,.35);

background:
linear-gradient(
135deg,
rgba(0,0,0,.74),
rgba(25,5,8,.65)
);

box-shadow:
inset 0 0 15px rgba(255,0,0,.07),
0 0 10px rgba(255,0,0,.18),
0 0 25px rgba(255,0,0,.10),
0 10px 25px rgba(0,0,0,.45);

}


/* RESET HOVER */

.reset-btn:hover{

border-color:
rgba(255,70,70,.80);

background:
linear-gradient(
135deg,
rgba(0,0,0,.82),
rgba(30,5,8,.72)
);

box-shadow:
inset 0 0 20px rgba(255,0,0,.12),
0 0 15px rgba(255,50,50,.45),
0 0 35px rgba(255,0,0,.25),
0 12px 30px rgba(0,0,0,.50);

}


/* RESET ACTIVE */

.reset-btn:active{

box-shadow:
inset 0 0 25px rgba(255,0,0,.18),
0 0 20px rgba(255,50,50,.55);

}

/* STATUS */

#status{
margin-top:16px;

text-align:center;

font-size:14px;

font-weight:500;

color:rgba(225,225,225,.95);

min-height:20px;

text-shadow:
0 2px 8px rgba(255,255,255,.35),
0 0 12px rgba(0,245,255,.45),
0 0 22px rgba(0,245,255,.25);

letter-spacing:.3px;
}

/* NAMA BARANG */

#namaBarang{

padding:12px 14px;

border-radius:14px;

background:rgba(255,255,255,.06);

font-weight:500;

text-align:center;

text-shadow:
0 0 10px rgba(0,245,255,.7),

0 2px 8px rgba(0,0,0,.8);

box-shadow:
0 0 12px rgba(0,245,255,.10);

min-height:20px;

}

/* DROPDOWN */

#suggestions{
position:absolute;

top:calc(100% + 8px);

left:0;
right:0;

max-height:320px;

overflow-y:auto;

overscroll-behavior:contain;

z-index:9999999;

background:
linear-gradient(
rgba(0,0,0,.75),
rgba(0,0,0,.75)
),
url('232c59a2-a76c-4766-8c58-20a6e1b7550a.jpeg')
center center / cover no-repeat;

border-radius:18px;

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 10px 25px rgba(0,0,0,.35);

-webkit-overflow-scrolling:touch;

transform:translateZ(999px);
}

.suggest-item{
padding:12px 20px;

border-bottom:1px solid rgba(255,255,255,.05);

cursor:pointer;

transition:.2s;

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

text-align:center;
}

.suggest-item:last-child{
border-bottom:none;
}

.suggest-item:hover{
background:rgba(255,255,255,.08);
}

.suggest-barcode{

font-weight:700;

color:#00f5ff;
}

.suggest-name{
font-size:13px;

color:#cbd5e1;

margin-top:4px;

line-height:1.4;
}

/* MODAL */

.modal{
position:fixed;
inset:0;

display:none;

align-items:center;
justify-content:center;

background:rgba(0,0,0,.72);

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

z-index:999999999;

padding:20px;

overflow:auto;
}

/* MODAL BOX */

.modal-box{
width:90%;
max-width:360px;

padding:28px;

border-radius:28px;

background:
linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.45)
),
url('232c59a2-a76c-4766-8c58-20a6e1b7550a.jpeg')

box-shadow:

}

@keyframes popup{

}
to{

}

.modal-title{

font-size:22px;

0 0 10px rgba(0,245,255,.45),

padding:16px;

background:rgba(0,0,0,.35);

.modal-input:focus{

box-shadow:
0 0 12px rgba(0,245,255,.35),

}

.modal-actions{
display:flex;

gap:12px;
}

.modal-actions button{
flex:1;

padding:14px;

border-radius:16px;
}

.cancel-btn{
background:rgba(255,255,255,.08);
}

.confirm-btn{
background:
linear-gradient(
135deg,
#00f5ff,
#7c3aed
);
}

padding:28px;
}

}

}

}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes tbMarlinAppear{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.15)
            rotate(-12deg);
    }

    70%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.08)
            rotate(-3deg);
    }

    100%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1)
            rotate(-3deg);
    }
}


@keyframes tbGolokSlash{

    0%{
        transform:
            translate(-50%,-50%)
            rotate(-52deg)
            translateX(-360px);
    }

    55%{
        transform:
            translate(-50%,-50%)
            rotate(-52deg)
            translateX(0);
    }

    100%{
        transform:
            translate(-50%,-50%)
            rotate(-52deg)
            translateX(360px);
    }
}


@keyframes tbSlash{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            rotate(-52deg)
            scaleX(0);
    }

    30%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            rotate(-52deg)
            scaleX(1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            rotate(-52deg)
            scaleX(1.15);
    }
}


@keyframes tbCutLine{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scaleY(0);
    }

    30%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scaleY(1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scaleY(1);
    }
}


/* IKAN KIRI TERBELAH */

@keyframes tbMarlinLeftSplit{

    0%{
        opacity:1;
        transform:
            translateX(0)
            translateY(0)
            rotate(0);
    }

    100%{
        opacity:0;
        transform:
            translateX(-90px)
            translateY(25px)
            rotate(-8deg);
    }
}


/* IKAN KANAN TERBELAH */

@keyframes tbMarlinRightSplit{

    0%{
        opacity:1;
        transform:
            translateX(0)
            translateY(0)
            rotate(0);
    }

    100%{
        opacity:0;
        transform:
            translateX(90px)
            translateY(-20px)
            rotate(6deg);
    }
}


@keyframes tbSpark{

    0%{
        opacity:0;
        transform:translate(0,0) scale(.3);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(var(--x),var(--y))
            scale(1.3);
    }
}


@keyframes tbTextAppear{

    0%{
        opacity:0;
        transform:
            translateX(-50%)
            translateY(20px);
    }

    100%{
        opacity:1;
        transform:
            translateX(-50%)
            translateY(0);
    }
}


@keyframes tbGlow{

    0%,100%{
        opacity:.55;
        transform:scale(.85);
    }

    50%{
        opacity:1;
        transform:scale(1.15);
    }
}


@keyframes tbOpeningOut{

    0%{
        opacity:1;
        visibility:visible;
    }

    100%{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}


@keyframes tbLoginAppear{

    0%{
        opacity:0;
        transform:
            translateY(25px)
            scale(.94);
    }

    100%{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

<script>

/* ================================================= */
/* CONFIG */
/* ================================================= */

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyYp-CRc2wUKF-OQ8VFb3NApejjOSpIDbdlVxcsvgDtY8YHEwGdysxaHU1ruQATXOIS-w/exec";

const ADMIN_PASSWORD = "0800";

let currentMode = "";

let barcodeCache = [];

let debounceTimer;

let historyData = [];



/* ================================================= */
/* RENDER HISTORY */
/* ================================================= */

function renderHistory(){

const box =
document.getElementById(
"historyBox"
);

const list =
document.getElementById(
"historyList"
);


if(
!Array.isArray(historyData) ||
historyData.length === 0
){

box.style.display = "none";

list.innerHTML = "";

return;

}


box.style.display = "block";


let html = "";


historyData
.slice(0,50)
.forEach(item=>{

html += `

<div class="history-item">

<div class="history-nama">
${escapeHTML(item.nama)}
</div>

<div class="history-qty">
${escapeHTML(item.qty)}
</div>

</div>

`;

});


list.innerHTML = html;

}


/* ================================================= */
/* ESCAPE HTML */
/* ================================================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================================================= */
/* TAMBAH HISTORY LANGSUNG */
/* ================================================= */

function addHistoryInstant(nama,qty){

historyData.unshift({

nama:nama || "-",

qty:qty

});


historyData =
historyData.slice(0,50);

renderHistory();

}


/* ================================================= */
/* LOAD BARCODE DARI MASTER */
/* ================================================= */

async function loadBarcodeData(){

try{

const res =
await fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify({
action:"getAllBarcode"
})

});

barcodeCache =
await res.json();

console.log(
"Barcode berhasil dimuat:",
barcodeCache.length
);

}catch(err){

console.log(
"Load barcode error:",
err
);

barcodeCache = [];

}

}

/* ================================================= */
/* AUTO FOCUS / INITIAL LOAD */
/* ================================================= */

window.onload = async () => {

await loadBarcodeData();

setTimeout(()=>{

document
.getElementById("loginPassword")
.focus();

},200);

};


/* ================================================= */
/* ================================================= */
/* LOGIN */
/* ================================================= */

function loginApp(){

const password =
document
.getElementById("loginPassword")
.value;


if(password !== ADMIN_PASSWORD){

document
.getElementById("loginStatus")
innerHTML =
"❌ Password salah";

return;

}


/* PASSWORD BENAR */

document
.getElementById("loginOverlay")
.style.display =
"none";


/* TAMPILKAN PILIH MODE */

document
.getElementById("modeOverlay")
.style.display =
"flex";

}


/* ================================================= */
/* PILIH MODE */
/* ================================================= */

function pilihMode(mode){

currentMode = mode;

const title =
document.querySelector("h1");

const desc =
document.querySelector(".desc");

const modeOverlay =
document.getElementById("modeOverlay");


if(mode === "stockloss"){

title.innerText =
"STOCKLOSS BSD";

desc.innerText =
"Scan / Input Barcode dan Qty";

document.querySelector(".reset-btn").innerText =
"Reset Data Stockloss";

}

else if(mode === "opname"){

title.innerText =
"STOCK OPNAME BSD";

desc.innerText =
"Scan / Input Barcode dan Qty";

document.querySelector(".reset-btn").innerText =
"Reset Data Stock Opname";

}


/* KOSONGKAN HISTORY MODE SEBELUMNYA */

historyData = [];

renderHistory();


modeOverlay.style.display =
"none";


/* LOAD HISTORY SESUAI MODE */

loadHistory();


setTimeout(()=>{

document
.getElementById("barcode")
.focus();

},100);

}


/* ================================================= */
/* ENTER LOGIN */
/* ================================================= */

document
.getElementById("loginPassword")
.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){

loginApp();

}

});

await fetch(URL_SCRIPT,{

/* ================================================= */
/* HIDE DROPDOWN */
/* ================================================= */

function hideSuggestions(){

document
.getElementById("suggestions")
.innerHTML = "";

}


/* ================================================= */
/* AUTO QTY + NAMA */
/* ================================================= */

document
.getElementById("barcode")
.addEventListener(
"input",
function(){

const barcode =
this.value.trim();


tampilkanNamaBarang(
barcode
);


if(
barcode.startsWith("20") &&
barcode.length === 13 &&
/^\d+$/.test(barcode)
){

hideSuggestions();


const qtyRaw =
barcode.substring(7,12);


const qtyNumber =
parseInt(
qtyRaw,
10
) / 1000;


let qtyFormatted =
qtyNumber
.toFixed(3)
.replace(/\.?0+$/,'');


qtyFormatted =
qtyFormatted.replace(
".",
","
);


document
.getElementById("qty")
.value =
qtyFormatted;

}

});


/* ================================================= */
/* TAMPILKAN NAMA BARANG */
/* ================================================= */

function tampilkanNamaBarang(barcode){

const namaBox =
document.getElementById(
"namaBarang"
);


let searchBarcode =
barcode;


/* BARCODE TIMBANG */

if(
barcode.startsWith("20") &&
barcode.length === 13 &&
/^\d+$/.test(barcode)
){

searchBarcode =
barcode.substring(2,7);

}


const item =
barcodeCache.find(x =>
String(x.barcode) ===
String(searchBarcode)
);


if(item){

namaBox.style.display =
"block";

namaBox.innerHTML =
escapeHTML(item.nama);

}else{

namaBox.style.display =
"none";

namaBox.innerHTML = "";

}

}


/* ================================================= */
/* AUTOCOMPLETE */
/* ================================================= */

document
.getElementById("barcode")
.addEventListener(
"input",
function(e){

e.stopPropagation();


clearTimeout(
debounceTimer
);


debounceTimer =
setTimeout(()=>{

const keyword =
this.value
.trim()
.toLowerCase();


const suggestions =
document.getElementById(
"suggestions"
);


if(keyword.length < 2){

suggestions.innerHTML = "";

return;

}


let filtered =
barcodeCache.filter(item=>{

const barcode =
String(item.barcode)
.toLowerCase();

const nama =
String(item.nama)
.toLowerCase();


return(
barcode.startsWith(keyword) ||
barcode.includes(keyword) ||
nama.includes(keyword)
);

});


filtered =
filtered.slice(0,20);


let html = "";


filtered.forEach(item=>{

html += `

<div
class="suggest-item"
onclick="pilihBarcode('${String(item.barcode).replace(/'/g,"\\'")}')">

<div class="suggest-barcode">
${escapeHTML(item.barcode)}
</div>

<div class="suggest-name">
${escapeHTML(item.nama)}
</div>

</div>

`;

});


suggestions.innerHTML =
html;


},120);

});

/* ================================================= */
/* KIRIM DATA - OPTIMIZED */
/* ================================================= */

async function kirimData(){

const barcodeInput =
document
.getElementById("barcode");


const qtyInput =
document
.getElementById("qty");


let barcode =
barcodeInput.value.trim();


let qty =
qtyInput.value.trim();


if(
barcode === "" ||
qty === ""
){

document
.getElementById("status")
.innerHTML =
"⚠️ Barcode dan Qty wajib diisi";

return;

}


let namaBarang = "";

let searchBarcode =
barcode;


/* BARCODE TIMBANG */

if(
barcode.startsWith("20") &&
barcode.length === 13 &&
/^\d+$/.test(barcode)
){

searchBarcode =
barcode.substring(2,7);

}


const item =
barcodeCache.find(x =>
String(x.barcode) ===
String(searchBarcode)
);


if(item){

namaBarang =
item.nama;

}


/* QTY */

qty =
qty.replace(",", ".");


const btn =
document
.getElementById("btnKirim");


btn.disabled = true;

btn.innerHTML =
"⏳ Mengirim...";


/* ================================================= */
/* SIMPAN DATA INPUT */
/* ================================================= */

barcodeInput.value = "";

qtyInput.value = "";

document
.getElementById("namaBarang")
.style.display =
"none";

document
.getElementById("namaBarang")
.innerHTML = "";

hideSuggestions();


/* ================================================= */
/* UPDATE HISTORY LANGSUNG */
/* ================================================= */

addHistoryInstant(
namaBarang || barcode,
qty
);


document
.getElementById("status")
.innerHTML =
"⏳ Menyimpan data...";


barcodeInput.focus();


/* ================================================= */
/* KIRIM KE GOOGLE */
/* ================================================= */

try{

const res =
await fetch(
URL_SCRIPT,
{

method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"saveData",

barcode:barcode,

qty:qty,

mode:currentMode

})

});


const result =
await res.text();


if(
result.startsWith("Success")
){

document
.getElementById("status")
.innerHTML =
"✅ Data berhasil dikirim";

}else{

throw new Error(result);

}


}catch(err){

console.log(
"Send error:",
err
);


/*
 * Jika gagal, hapus history
 * yang tadi ditampilkan secara lokal.
 */

historyData.shift();

renderHistory();


document
.getElementById("status")
.innerHTML =
"❌ Gagal mengirim data";


}finally{

btn.disabled = false;

btn.innerHTML =
"Kirim Data";

}

}

.getElementById("passwordModal")
.style.display =
"flex";

document
.getElementById("passwordModal")
.style.display =
"none";

.getElementById("adminPassword")
.value = "";

}


/* ================================================= */
/* ENTER PASSWORD RESET */
/* ================================================= */

document.addEventListener(
"keydown",
function(e){

const modal =
document.getElementById(
"passwordModal"
);


if(
modal.style.display ===
"flex"
){

if(e.key === "Enter"){

e.preventDefault();

submitReset();

}


if(e.key === "Escape"){

closePasswordModal();

}

}

});

/* RESET */
/* ================================================= */

function resetData(){

openPasswordModal();

}


/* ================================================= */
/* SUBMIT RESET - OPTIMIZED */
/* ================================================= */

async function submitReset(){

const password =
document
.getElementById("adminPassword")
.value;


if(password !== ADMIN_PASSWORD){

document
.getElementById("status")
.innerHTML =
"❌ Password salah";

return;

}


closePasswordModal();


const namaMode =
currentMode === "opname"
? "STOCK OPNAME"
: "STOCKLOSS";

const konfirmasi =
confirm(
`Yakin ingin menghapus semua data ${namaMode} sebelumnya?`
);


if(!konfirmasi){

return;

}


/* ================================================= */
/* LANGSUNG KOSONGKAN HISTORY */
/* ================================================= */

historyData = [];

renderHistory();


document
.getElementById("barcode")
.value = "";

document
.getElementById("qty")
.value = "";

document
.getElementById("namaBarang")
.style.display =
"none";

document
.getElementById("namaBarang")
.innerHTML = "";

hideSuggestions();


document
.getElementById("status")
.innerHTML =
"⏳ Menghapus data...";


const resetButton =
document.querySelector(
".reset-btn"
);


resetButton.disabled =
true;


try{

const res =
await fetch(
URL_SCRIPT,
{

method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"reset",

password:password,

mode:currentMode

})

});


const result =
await res.text();


if(
result ===
"Reset berhasil"
){

document
.getElementById("status")
.innerHTML =
`✅ Semua data ${namaMode} sebelumnya berhasil dihapus`;


}else{

throw new Error(result);

}


}catch(err){

console.log(
"Reset error:",
err
);


document
.getElementById("status")
.innerHTML =
"❌ Gagal reset data";


/*
 * Jika reset gagal,
 * ambil kembali history asli.
 */

await loadHistory();


}finally{

resetButton.disabled =
false;


document
.getElementById("barcode")
.focus();

}

}

</script>
