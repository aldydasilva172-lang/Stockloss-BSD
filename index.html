<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STOCKLOSS BSD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html,body{
overscroll-behavior:none;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

background:
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png')
center center / cover no-repeat fixed;

overflow:hidden;
}

/* CONTAINER */
.container{
position:relative;
z-index:1;

overflow:visible;

width:100%;
max-width:430px;
padding:35px;
border-radius:28px;

background:transparent;
}

/* LOGO */
.logo{
width:85px;
height:85px;

margin:auto;
margin-bottom:22px;

border-radius:26px;

display:flex;
justify-content:center;
align-items:center;

font-size:38px;
font-weight:700;

color:white;

background:
linear-gradient(
rgba(0,0,0,.25),
rgba(0,0,0,.25)
),
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png')
center center / cover no-repeat;

border:1px solid rgba(255,255,255,.10);

backdrop-filter:blur(8px);

box-shadow:
0 0 20px rgba(0,245,255,.20),
0 8px 20px rgba(0,0,0,.35);

text-shadow:
0 2px 8px rgba(0,0,0,.8);
}

h1{
text-align:center;
font-size:30px;
font-weight:700;
margin-bottom:8px;

color:white;

text-shadow:
0 0 10px rgba(0,245,255,.7),
0 0 20px rgba(124,58,237,.5),
0 2px 8px rgba(0,0,0,.8);

letter-spacing:1px;
}

.desc{
text-align:center;
font-size:14px;

color:#7dd3fc;

margin-bottom:30px;

text-shadow:
0 0 8px rgba(56,189,248,.5),
0 0 18px rgba(14,165,233,.35);

letter-spacing:.5px;
}

/* INPUT BOX */
.input-box{
margin-bottom:20px;
position:relative;

background:rgba(0,0,0,.18);

border-radius:22px;

padding:14px;

backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);

box-shadow:
0 4px 15px rgba(0,0,0,.25);

overflow:visible;

isolation:isolate;

transform:translateZ(0);
will-change:transform;
}

.input-box:first-of-type{
z-index:999999;
}

.input-box:nth-of-type(2){
z-index:1;
}

.input-box label{
display:block;
margin-bottom:8px;

font-size:14px;
font-weight:600;

color:white;

text-shadow:
0 2px 8px rgba(0,0,0,.7),
0 0 8px rgba(0,245,255,.35);

letter-spacing:.5px;
}

.input-box input{
width:100%;
padding:16px;

border:none;
outline:none;

border-radius:16px;

background:rgba(0,0,0,.25);

color:white;

font-size:15px;
font-weight:500;

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(6px);

transition:.3s;

box-shadow:
0 4px 12px rgba(0,0,0,.25);
}

.input-box input:focus{

border:1px solid rgba(0,245,255,.7);

background:rgba(0,0,0,.35);

box-shadow:
0 0 12px rgba(0,245,255,.35),
0 0 25px rgba(124,58,237,.20),
0 4px 15px rgba(0,0,0,.35);

transform:scale(1.01);

}

input::placeholder{
color:rgba(219,234,254,.55);

text-shadow:
0 0 6px rgba(0,245,255,.18);

letter-spacing:.4px;
}

/* BUTTON */
button{
width:100%;
padding:16px;

border:none;
border-radius:18px;

background:
linear-gradient(
rgba(0,0,0,.20),
rgba(0,0,0,.20)
),
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png')
center center / cover no-repeat;

color:white;

font-size:16px;
font-weight:600;

cursor:pointer;

transition:.3s;

border:1px solid rgba(255,255,255,.10);

backdrop-filter:blur(6px);

box-shadow:
0 6px 18px rgba(0,0,0,.35),
0 0 15px rgba(0,245,255,.12);

text-shadow:
0 2px 8px rgba(0,0,0,.8);

letter-spacing:.5px;
}

button:hover{

transform:
translateY(-2px)
scale(1.01);

box-shadow:
0 10px 25px rgba(0,0,0,.45),
0 0 20px rgba(0,245,255,.20);

filter:brightness(1.05);

}

button:disabled{

opacity:.6;

cursor:not-allowed;

filter:grayscale(.2);

}

.reset-btn{

margin-top:12px;

border:1px solid rgba(255,80,80,.25);

box-shadow:
0 6px 18px rgba(0,0,0,.35),
0 0 15px rgba(255,80,80,.15);

}

/* STATUS */
#status{

margin-top:18px;

text-align:center;

font-size:14px;

font-weight:500;

color:rgba(255,255,255,.88);

min-height:20px;

text-shadow:
0 2px 8px rgba(0,0,0,.75),
0 0 10px rgba(0,245,255,.15);

letter-spacing:.3px;

}

/* DROPDOWN */
#suggestions{
position:absolute;

top:calc(100% + 8px);
left:0;
right:0;

max-height:320px;
overflow-y:auto;

z-index:9999999;

background:
linear-gradient(
rgba(0,0,0,.55),
rgba(0,0,0,.55)
),
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png')
center center / cover no-repeat;

backdrop-filter:blur(8px);

border-radius:18px;

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 10px 25px rgba(0,0,0,.35);

-webkit-overflow-scrolling:touch;

transform:translateZ(999px);
}

.suggest-item{
padding:16px 20px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
transition:.2s;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

text-align:center;
}

.suggest-item:last-child{
border-bottom:none;
}

.suggest-item:hover{
background:rgba(255,255,255,.08);
}

.suggest-barcode{
font-size:14px;
font-weight:700;
color:#00f5ff;
}

.suggest-name{
font-size:13px;
color:#cbd5e1;
margin-top:4px;
line-height:1.4;
}

/* MODAL */
.modal{
position:fixed;
inset:0;

display:none;
align-items:center;
justify-content:center;

background:rgba(0,0,0,.72);

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

z-index:999999999;
}

/* MODAL BOX */
.modal-box{
width:90%;
max-width:360px;

padding:28px;

border-radius:28px;

background:
linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.45)
),
url('8E3DEEF4-4D88-4CEE-8D4F-6C350C979398.png')
center center / cover no-repeat;

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

box-shadow:
0 0 15px rgba(0,245,255,.25),
0 0 35px rgba(124,58,237,.20),
0 15px 35px rgba(0,0,0,.45);

animation:popup .25s ease;

overflow:hidden;

position:relative;
}

@keyframes popup{
from{
transform:scale(.85);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.modal-title{
text-align:center;
font-size:22px;
font-weight:700;

color:white;

margin-bottom:20px;

text-shadow:
0 0 10px rgba(0,245,255,.45),
0 2px 8px rgba(0,0,0,.8);
}

.modal-input{
width:100%;
padding:16px;

border:none;
outline:none;

border-radius:18px;

background:rgba(0,0,0,.35);

color:white;

font-size:16px;

border:1px solid rgba(255,255,255,.08);

margin-bottom:18px;

transition:.3s;
}

.modal-input:focus{

border:1px solid rgba(0,245,255,.7);

box-shadow:
0 0 12px rgba(0,245,255,.35),
0 0 25px rgba(124,58,237,.20);

background:rgba(0,0,0,.45);

}

.modal-actions{
display:flex;
gap:12px;
}

.modal-actions button{
flex:1;
padding:14px;
border-radius:16px;
}

.cancel-btn{
background:rgba(255,255,255,.08);
}

.confirm-btn{
background:
linear-gradient(
135deg,
#00f5ff,
#7c3aed
);
}

@media(max-width:500px){

.container{
padding:28px;
}

h1{
font-size:24px;
}

#suggestions{
max-height:280px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="logo">☠️</div>

<h1>STOCKLOSS BSD</h1>

<p class="desc">
Scan / Input Barcode dan Qty Stockloss
</p>

<div class="input-box">

<label>Barcode</label>

<input 
type="text" 
id="barcode" 
placeholder="Scan / Input Barcode"
autocomplete="off"
>

<div id="suggestions"></div>

</div>

<div class="input-box">

<label>Qty</label>

<input 
type="text"
inputmode="decimal"
id="qty" 
placeholder="Masukkan Qty"
>

</div>

<button id="btnKirim" onclick="kirimData()">
Kirim Data
</button>

<button onclick="resetData()" class="reset-btn">
Reset Data Stockloss
</button>

<div id="status"></div>

</div>

<!-- MODAL PASSWORD -->
<div class="modal" id="passwordModal">

<div class="modal-box">

<div class="modal-title">
🔐 Password Admin
</div>

<input
type="password"
id="adminPassword"
class="modal-input"
placeholder="Masukkan password"
>

<div class="modal-actions">

<button
class="cancel-btn"
onclick="closePasswordModal()">
Batal
</button>

<button
class="confirm-btn"
onclick="submitReset()">
Masuk
</button>

</div>

</div>

</div>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyYp-CRc2wUKF-OQ8VFb3NApejjOSpIDbdlVxcsvgDtY8YHEwGdysxaHU1ruQATXOIS-w/exec";

const ADMIN_PASSWORD = "00";

let barcodeCache = [];
let debounceTimer;

/* AUTO FOCUS */
window.onload = async () => {

document.getElementById("barcode").focus();

await loadBarcodeData();

};

/* LOAD BARCODE */
async function loadBarcodeData(){

try{

const res = await fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({
action:"getAllBarcode"
})

});

barcodeCache = await res.json();

}catch(err){

console.log(err);

}

}

/* HIDE DROPDOWN */
function hideSuggestions(){

document.getElementById("suggestions").innerHTML = "";

}

/* AUTO QTY */
document
.getElementById("barcode")
.addEventListener("input", function(){

let barcode = this.value.trim();

if(
barcode.startsWith("20") &&
barcode.length === 13 &&
/^\d+$/.test(barcode)
){

hideSuggestions();

let qtyRaw = barcode.substring(7,12);

let qtyNumber =
parseInt(qtyRaw,10) / 1000;

let qtyFormatted =
qtyNumber
.toFixed(3)
.replace(/\.?0+$/,'');

qtyFormatted =
qtyFormatted.replace(".",",");

document.getElementById("qty").value =
qtyFormatted;

}

});

/* AUTOCOMPLETE */
document
.getElementById("barcode")
.addEventListener("input", function(e){

e.stopPropagation();

clearTimeout(debounceTimer);

debounceTimer = setTimeout(() => {

let keyword =
this.value.trim().toLowerCase();

const suggestions =
document.getElementById("suggestions");

if(keyword.length < 2){

suggestions.innerHTML = "";
return;

}

let filtered = barcodeCache.filter(item => {

let barcode =
String(item.barcode).toLowerCase();

let nama =
String(item.nama).toLowerCase();

return (

barcode.startsWith(keyword) ||

barcode.includes(keyword) ||

nama.includes(keyword)

);

});

filtered = filtered.slice(0,20);

let html = "";

filtered.forEach(item => {

html += `

<div class="suggest-item"
onclick="pilihBarcode('${item.barcode}')">

<div class="suggest-barcode">
${item.barcode}
</div>

<div class="suggest-name">
${item.nama}
</div>

</div>

`;

});

suggestions.innerHTML = html;

},120);

});

/* HIDE SAAT FOCUS QTY */
document.getElementById("qty")
.addEventListener("focus",function(){

hideSuggestions();

});

/* HIDE CLICK LUAR */
document.addEventListener("click",function(e){

if(!e.target.closest(".input-box")){

hideSuggestions();

}

});

/* PILIH BARCODE */
function pilihBarcode(barcode){

document.getElementById("barcode").value =
barcode;

hideSuggestions();

document.getElementById("qty").focus();

}

/* ENTER BARCODE */
document.getElementById("barcode")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

e.preventDefault();

hideSuggestions();

document.getElementById("qty").focus();

}

});

/* ENTER QTY */
document.getElementById("qty")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

e.preventDefault();

hideSuggestions();

kirimData();

}

});

/* KIRIM */
async function kirimData(){

let barcode =
document.getElementById("barcode").value.trim();

let qty =
document.getElementById("qty").value.trim();

qty = qty.replace(",", ".");

let btn =
document.getElementById("btnKirim");

if(barcode === "" || qty === ""){

document.getElementById("status").innerHTML =
"⚠️ Barcode dan Qty wajib diisi";

return;

}

btn.disabled = true;
btn.innerHTML = "⏳ Mengirim...";

document.getElementById("barcode").value = "";
document.getElementById("qty").value = "";

hideSuggestions();

document.getElementById("barcode").focus();

document.getElementById("status").innerHTML =
"⏳ Mengirim data...";

try{

await fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

barcode:barcode,
qty:qty

})

});

document.getElementById("status").innerHTML =
"✅ Data berhasil dikirim";

}catch(err){

document.getElementById("status").innerHTML =
"❌ Gagal mengirim data";

console.log(err);

}finally{

btn.disabled = false;
btn.innerHTML = "Kirim Data";

}

}

/* BUKA MODAL */
function openPasswordModal(){

document.getElementById("passwordModal").style.display =
"flex";

setTimeout(()=>{

document.getElementById("adminPassword").focus();

},100);

}

/* TUTUP MODAL */
function closePasswordModal(){

document.getElementById("passwordModal").style.display =
"none";

document.getElementById("adminPassword").value = "";

}

/* ENTER PASSWORD */
document.addEventListener("keydown",function(e){

const modal =
document.getElementById("passwordModal");

if(modal.style.display === "flex"){

if(e.key === "Enter"){

submitReset();

}

if(e.key === "Escape"){

closePasswordModal();

}

}

});

/* RESET */
function resetData(){

openPasswordModal();

}

/* SUBMIT RESET */
function submitReset(){

let password =
document.getElementById("adminPassword").value;

if(password !== ADMIN_PASSWORD){

document.getElementById("status").innerHTML =
"❌ Password salah";

return;

}

closePasswordModal();

let konfirmasi = confirm(
"Yakin ingin menghapus semua data sheet SLT?"
);

if(!konfirmasi) return;

document.getElementById("status").innerHTML =
"⏳ Menghapus data...";

fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"reset",
password:password

})

})

.then(res => res.text())

.then(data => {

document.getElementById("status").innerHTML =
"✅ Semua data stockloss sebelumnya berhasil dihapus";

document.getElementById("barcode").value = "";
document.getElementById("qty").value = "";

document.getElementById("barcode").focus();

})

.catch(err => {

document.getElementById("status").innerHTML =
"❌ Gagal reset data";

console.log(err);

});

}

</script>

</body>
</html>
