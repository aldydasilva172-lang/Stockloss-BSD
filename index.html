<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STOCKLOSS BSD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html, body{
width:100%;
min-height:100%;
margin:0;
padding:0;
overscroll-behavior:none;

-webkit-text-size-adjust:100%;
}

body{
min-height:100dvh;
min-height:-webkit-fill-available;

padding:20px;

position:relative;

background:
linear-gradient(
        rgba(0,0,0,.60),
        rgba(0,0,0,.60)
    ),
url('232c59a2-a76c-4766-8c58-20a6e1b7550a.jpeg')
center top / 100% auto repeat-y;

overflow-x:hidden;
overflow-y:auto;

display:block;
}

/* LOGIN OVERLAY */
.login-overlay{
position:fixed;
inset:0;

display:flex;
justify-content:center;
align-items:center;

z-index:9999999999;

background:
linear-gradient(
rgba(0,0,0,.80),
rgba(0,0,0,.80)
),
url('232c59a2-a76c-4766-8c58-20a6e1b7550a.jpeg')
center center / cover no-repeat;

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

overflow:auto;
}
/* LOGIN BOX */
.login-box{
width:90%;
max-width:360px;

padding:30px;

border-radius:28px;

background:
linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.45)
),
url('232c59a2-a76c-4766-8c58-20a6e1b7550a.jpeg')
center center / cover no-repeat;

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

box-shadow:
0 0 20px rgba(0,245,255,.25),
0 0 40px rgba(124,58,237,.20),
0 15px 35px rgba(0,0,0,.45);

}

.login-title{
text-align:center;

font-size:24px;
font-weight:700;

color:white;

margin-bottom:10px;

text-shadow:
0 0 10px rgba(0,245,255,.45),
0 2px 8px rgba(0,0,0,.8);
}

.login-desc{
text-align:center;

font-size:13px;

color:#cbd5e1;

}

.login-input{
width:100%;
padding:16px;

border:none;
outline:none;

border-radius:18px;

background:rgba(0,0,0,.35);

color:white;
font-size:16px;

border:1px solid rgba(255,255,255,.08);
        
box-shadow:
    0 0 12px rgba(0,245,255,.35),
    0 0 25px rgba(124,58,237,.20);

margin-bottom:18px;

transition:.3s;
}

.login-input:focus{
    box-shadow:
    0 0 18px rgba(0,245,255,.55),
    0 0 35px rgba(124,58,237,.35);

    background:rgba(0,0,0,.45);
}

.login-btn{
width:100%;
}

/* CONTAINER */
.container{
position:relative;
z-index:1;

overflow:visible;

width:100%;
max-width:430px;
padding:35px;
border-radius:28px;

background:transparent;
}

h1{
text-align:center;
font-size:40px;
font-weight:700;
margin-bottom:8px;

color:white;

text-shadow:
0 0 10px rgba(0,245,255,.7),
0 0 20px rgba(124,58,237,.5),
0 2px 8px rgba(0,0,0,.8);

letter-spacing:1px;
}

.desc{
text-align:center;
font-size:12px;

color:#f97316;

margin-bottom:30px;

text-shadow:
0 0 8px rgba(56,189,248,.5),

letter-spacing:.5px;
}

/* LAST INPUT */
.last-input-box{

display:none;

margin-top:16px;
margin-bottom:8px;

border:1px solid rgba(255,255,255,.08);

background:rgba(0,0,0,.02);

border-radius:22px;

padding:10px 12px;

backdrop-filter:blur(2px);
-webkit-backdrop-filter:blur(2px);

box-shadow:
0 0 14px rgba(0,245,255,.18),
0 0 28px rgba(124,58,237,.25),
0 8px 22px rgba(0,0,0,.32);

text-align:center;

}

.last-title{

font-size:15px;
font-weight:600;

color:White;

margin-bottom:6px;

text-shadow:
0 0 10px rgba(0,245,255,.7),
0 0 20px rgba(124,58,237,.5),
0 2px 8px rgba(0,0,0,.8)
}

.last-name{

font-size:10px;
font-weight:600;
color:#f97316;

text-shadow:
0 0 10px rgba(0,245,255,.7),
0 0 20px rgba(124,58,237,.5),
0 2px 8px rgba(0,0,0,.8);

margin-bottom:1px;
}

.last-qty{

font-size:10px;
color:#f97316;

text-shadow:
0 0 10px rgba(0,245,255,.7),
0 0 20px rgba(124,58,237,.5),
0 2px 8px rgba(0,0,0,.8)
}

.history-header{
display:flex;

background:rgba(249,115,22,.20);

border:1px solid rgba(249,115,22,.35);

border-radius:10px 10px 0 0;

font-size:12px;
font-weight:700;

color:#f97316;

margin-bottom:2px;
}

.history-header div:first-child{
flex:1;

padding:8px 10px;

border-right:1px solid rgba(249,115,22,.35);

text-align:center;
}

.history-header div:last-child{
width:60px;

padding:8px;

text-align:center;
}

.history-item{
display:flex;
align-items:center;

border:1px solid rgba(255,255,255,.10);

background:rgba(0,0,0,.08);

margin-bottom:2px;

overflow:hidden;
}

.history-nama{
flex:1;

padding:8px 10px;

font-size:13px;
font-weight:600;

color:white;

text-align:left;

border-right:1px solid rgba(255,255,255,.10);

text-shadow:
0 0 5px rgba(0,245,255,.35),

}

.history-qty{
min-width:60px;

text-align:center;

font-size:12px;
font-weight:700;

color:#f97316;

background:transparent;

0 0 6px rgba(249,115,22,.35);
}

/* INPUT BOX */
.input-box{
margin-bottom:16px;
position:relative;

border:1px solid rgba(255,255,255,.08);

background:rgba(0,0,0,.12);

border-radius:22px;

padding:14px;

backdrop-filter:blur(4px);
-webkit-backdrop-filter:blur(4px);

box-shadow:
0 0 14px rgba(0,245,255,.18),
0 0 28px rgba(124,58,237,.14),
0 8px 22px rgba(0,0,0,.32);

overflow:visible;
}

.barcode-box{
z-index:9999;
}

.qty-box{
z-index:1;
}

.input-box label{
display:block;
margin-bottom:8px;

font-size:14px;
font-weight:600;

color:white;

text-shadow:
0 2px 8px rgba(0,0,0,.7),
0 0 8px rgba(0,245,255,.35);

letter-spacing:.5px;
}

.input-box input{
width:100%;
padding:16px;

border:none;
outline:none;

border-radius:16px;

border:1px solid rgba(255,255,255,.08);

background:rgba(0,0,0,.25);

color:white;

font-size:15px;
font-weight:500;

backdrop-filter:blur(6px);

transition:.3s;

box-shadow:
0 4px 12px rgba(0,0,0,.25);
}

.input-box input:focus{

border:1px solid rgba(0,245,255,.7);

background:rgba(0,0,0,.35);

box-shadow:
0 0 12px rgba(0,245,255,.35),
0 0 25px rgba(124,58,237,.20),
0 4px 15px rgba(0,0,0,.35);

transform:scale(1.01);

}

input::placeholder{
color:rgba(219,234,254,.55);

text-shadow:
0 0 6px rgba(0,245,255,.18);

letter-spacing:.4px;
}

/* BUTTON */
button{
width:100%;
padding:16px;

border:none;
border-radius:18px;

background:
linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.65)
),
url('6470974e-f80e-4098-a38e-f3f838dc6672.jpeg')
center center / cover no-repeat;

color:white;

font-size:16px;
font-weight:600;

cursor:pointer;

transition:.3s;

border:1px solid rgba(255,255,255,.10);

backdrop-filter:blur(6px);

box-shadow:
    0 0 15px rgba(255,0,0,.45),
    0 0 35px rgba(255,0,0,.30),
    0 10px 30px rgba(0,0,0,.40);


text-shadow:
0 2px 8px rgba(0,0,0,.8);

letter-spacing:.5px;
}

button:hover{

transform:
translateY(-2px)
scale(1.01);

box-shadow:
    0 0 20px rgba(255,0,0,.60),
    0 0 45px rgba(255,0,0,.40),
    0 15px 35px rgba(0,0,0,.45);
transition:.3s;

filter:brightness(1.05);

}

button:disabled{

opacity:.6;

cursor:not-allowed;

filter:grayscale(.2);

}

.reset-btn{

margin-top:12px;

border:1px solid rgba(255,80,80,.25);

box-shadow:
0 6px 18px rgba(0,0,0,.35),
0 0 25px rgba(255,80,80,.20);

}

/* STATUS */
#status{

margin-top:16px;

text-align:center;

font-size:14px;

font-weight:500;

color:rgba(0,0,0,.88);

min-height:20px;

text-shadow:
0 2px 8px rgba(255,255,255,.35),
0 0 12px rgba(0,245,255,.45),
0 0 22px rgba(0,245,255,.25);

letter-spacing:.3px;

}

/* NAMA BARANG */
#namaBarang{

margin-top:10px;

padding:12px 14px;

border-radius:14px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);

color:white;

font-size:14px;
font-weight:500;

text-align:center;

text-shadow:
0 0 10px rgba(0,245,255,.7),
0 0 20px rgba(124,58,237,.5),
0 2px 8px rgba(0,0,0,.8);

box-shadow:
0 0 12px rgba(0,245,255,.10);

min-height:20px;

display:none;

}

/* DROPDOWN */
#suggestions{
position:absolute;

top:calc(100% + 8px);
left:0;
right:0;

max-height:320px;
overflow-y:auto;

overscroll-behavior:contain;

z-index:9999999;

background:
linear-gradient(
rgba(0,0,0,.75),
rgba(0,0,0,.75)
),
url('232c59a2-a76c-4766-8c58-20a6e1b7550a.jpeg')
center center / cover no-repeat;

backdrop-filter:blur(8px);

border-radius:18px;

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 10px 25px rgba(0,0,0,.35);

-webkit-overflow-scrolling:touch;

transform:translateZ(999px);
}

.suggest-item{
padding:12px 20px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
transition:.2s;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

text-align:center;
}

.suggest-item:last-child{
border-bottom:none;
}

.suggest-item:hover{
background:rgba(255,255,255,.08);
}

.suggest-barcode{
font-size:14px;
font-weight:700;
color:#00f5ff;
}

.suggest-name{
font-size:13px;
color:#cbd5e1;
margin-top:4px;
line-height:1.4;
}

/* MODAL */
.modal{
position:fixed;
inset:0;

display:none;
align-items:center;
justify-content:center;

background:rgba(0,0,0,.72);

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

z-index:999999999;

padding:20px;
overflow:auto;
}

/* MODAL BOX */
.modal-box{
width:90%;
max-width:360px;

padding:28px;

border-radius:28px;

background:
linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.45)
),
url('232c59a2-a76c-4766-8c58-20a6e1b7550a.jpeg')
center center / cover no-repeat;

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);

box-shadow:
0 0 15px rgba(0,245,255,.25),
0 0 35px rgba(124,58,237,.20),
0 15px 35px rgba(0,0,0,.45);

animation:popup .25s ease;

overflow:hidden;

position:relative;
}

@keyframes popup{
from{
transform:scale(.85);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.modal-title{
text-align:center;
font-size:22px;
font-weight:700;

color:white;

margin-bottom:20px;

text-shadow:
0 0 10px rgba(0,245,255,.45),
0 2px 8px rgba(0,0,0,.8);
}

.modal-input{
width:100%;
padding:16px;

border:none;
outline:none;

border-radius:18px;

background:rgba(0,0,0,.35);

color:white;

font-size:16px;

border:1px solid rgba(255,255,255,.08);

margin-bottom:18px;

transition:.3s;
}

.modal-input:focus{

border:1px solid rgba(0,245,255,.7);

box-shadow:
0 0 12px rgba(0,245,255,.35),
0 0 25px rgba(124,58,237,.20);

background:rgba(0,0,0,.45);

}

.modal-actions{
display:flex;
gap:12px;
}

.modal-actions button{
flex:1;
padding:14px;
border-radius:16px;
}

.cancel-btn{
background:rgba(255,255,255,.08);
}

.confirm-btn{
background:
linear-gradient(
135deg,
#00f5ff,
#7c3aed
);
}

@media(max-width:500px){

.container{
padding:28px;
}

h1{
font-size:24px;
}

#suggestions{
max-height:280px;
}

}

@supports (-webkit-touch-callout: none){

html{
height:-webkit-fill-available;
}

body{
min-height:-webkit-fill-available;
}

}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:100%;
max-width:450px;
margin:0 auto;
}

}

</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-overlay" id="loginOverlay">

<div class="login-box">

<div class="login-title">
STOCKLOSS BSD
</div>

<div class="login-desc">
Silahkan masukkan password terlebih dahulu
</div>

<input
type="password"
id="loginPassword"
class="login-input"
placeholder="Masukkan Password"
>

<button
class="login-btn"
onclick="loginApp()">
Masuk
</button>

<div
id="loginStatus"
style="
margin-top:14px;
text-align:center;
font-size:13px;
color:#fff;
min-height:18px;
">
</div>

</div>

</div>

<div class="container">

<h1>STOCKLOSS BSD</h1>

<p class="desc">
Scan / Input Barcode dan Qty
</p>

<div class="input-box barcode-box">

<label>Barcode</label>

<input 
type="text" 
id="barcode" 
placeholder="Scan / Input Barcode"
autocomplete="off"
>

<div id="namaBarang"></div>

<div id="suggestions"></div>

</div>

<label>Qty</label>

type="text"
inputmode="decimal"
enterkeyhint="enter"
id="qty" 
placeholder="Masukkan Qty"
>

Kirim Data
</button>

Reset Data Stockloss
</button>

<!-- HISTORY INPUT -->

<div class="last-title">
DATA INPUT
</div>

<div>ARTICLE NAME</div>
<div>QTY</div>
</div>

</div>
</div>

<div class="modal-box">

<div class="modal-title">
Silahkan Masukan Password
</div>

type="password"
id="adminPassword"
class="modal-input"

>

<div class="modal-actions">

class="cancel-btn"

Batal
</button>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyYp-CRc2wUKF-OQ8VFb3NApejjOSpIDbdlVxcsvgDtY8YHEwGdysxaHU1ruQATXOIS-w/exec";

const ADMIN_PASSWORD = "0800";

let barcodeCache = [];
let debounceTimer;

/* LAST INPUT */

async function loadHistory(){

try{

const res = await fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({
action:"getHistory"
})

});

const history =
await res.json();

const box =
document.getElementById("historyBox");

const list =
document.getElementById("historyList");

if(history.length === 0){

box.style.display = "none";

list.innerHTML = "";

return;

}

box.style.display = "block";

let html = "";

history.forEach(item=>{

html += `

<div class="history-item">

<div class="history-nama">
${item.nama}
</div>

<div class="history-qty">
${item.qty}
</div>

</div>

`;

});

list.innerHTML = html;

}catch(err){

console.log(err);

}

}

/* AUTO FOCUS */
window.onload = async () => {

await loadBarcodeData();

await loadHistory();

setTimeout(()=>{

document.getElementById("loginPassword").focus();

},200);

};

/* LOGIN APP */
function loginApp(){

let password =
document.getElementById("loginPassword").value;

if(password !== ADMIN_PASSWORD){

document.getElementById("loginStatus").innerHTML =
"❌ Password salah";

return;

}

document.getElementById("loginOverlay").style.display =
"none";

document.getElementById("barcode").focus();

}

/* ENTER LOGIN */
document
.getElementById("loginPassword")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

loginApp();

}

});

/* LOAD BARCODE */
async function loadBarcodeData(){

try{

const res = await fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({
action:"getAllBarcode"
})

});

barcodeCache = await res.json();

}catch(err){

console.log(err);

}

}

/* HIDE DROPDOWN */
function hideSuggestions(){

document.getElementById("suggestions").innerHTML = "";

}

/* AUTO QTY */
document
.getElementById("barcode")
.addEventListener("input", function(){

let barcode = this.value.trim();

tampilkanNamaBarang(barcode);

if(
barcode.startsWith("20") &&
barcode.length === 13 &&
/^\d+$/.test(barcode)
){

hideSuggestions();

let qtyRaw = barcode.substring(7,12);

let qtyNumber =
parseInt(qtyRaw,10) / 1000;

let qtyFormatted =
qtyNumber
.toFixed(3)
.replace(/\.?0+$/,'');

qtyFormatted =
qtyFormatted.replace(".",",");

document.getElementById("qty").value =
qtyFormatted;

}

});

/* TAMPILKAN NAMA BARANG */
function tampilkanNamaBarang(barcode){

let namaBox =
document.getElementById("namaBarang");

let searchBarcode = barcode;

/* BARCODE TIMBANG */
if(
barcode.startsWith("20") &&
barcode.length === 13 &&
/^\d+$/.test(barcode)
){

searchBarcode =
barcode.substring(2,7);

}

let item = barcodeCache.find(x =>
String(x.barcode) === String(searchBarcode)
);

if(item){

namaBox.style.display = "block";

namaBox.innerHTML = item.nama;

}else{

namaBox.style.display = "none";

namaBox.innerHTML = "";

}

}

/* AUTOCOMPLETE */
document
.getElementById("barcode")
.addEventListener("input", function(e){

e.stopPropagation();

clearTimeout(debounceTimer);

debounceTimer = setTimeout(() => {

let keyword =
this.value.trim().toLowerCase();

const suggestions =
document.getElementById("suggestions");

if(keyword.length < 2){

suggestions.innerHTML = "";
return;

}

let filtered = barcodeCache.filter(item => {

let barcode =
String(item.barcode).toLowerCase();

let nama =
String(item.nama).toLowerCase();

return (

barcode.startsWith(keyword) ||

barcode.includes(keyword) ||

nama.includes(keyword)

);

});

filtered = filtered.slice(0,20);

let html = "";

filtered.forEach(item => {

html += `

<div class="suggest-item"
onclick="pilihBarcode('${item.barcode}')">

<div class="suggest-barcode">
${item.barcode}
</div>

<div class="suggest-name">
${item.nama}
</div>

</div>

`;

});

suggestions.innerHTML = html;

},120);

});

/* HIDE SAAT FOCUS QTY */
document.getElementById("qty")
.addEventListener("focus",function(){

hideSuggestions();

});

/* HIDE CLICK LUAR */
document.addEventListener("click",function(e){

if(!e.target.closest(".input-box")){

hideSuggestions();

}

});

/* PILIH BARCODE */
function pilihBarcode(barcode){

document.getElementById("barcode").value =
barcode;

tampilkanNamaBarang(barcode);

hideSuggestions();

document.getElementById("qty").focus();

}

/* ENTER BARCODE */
document.getElementById("barcode")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

e.preventDefault();

hideSuggestions();

document.getElementById("qty").focus();

}

});

/* ENTER QTY */
document.getElementById("qty")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

e.preventDefault();

hideSuggestions();

kirimData();

}

});

/* KIRIM */
async function kirimData(){

let barcode =
document.getElementById("barcode").value.trim();

let qty =
document.getElementById("qty").value.trim();

let namaBarang = "";

let searchBarcode = barcode;

if(
barcode.startsWith("20") &&
barcode.length === 13 &&
/^\d+$/.test(barcode)
){

searchBarcode =
barcode.substring(2,7);

}

let item = barcodeCache.find(x =>
String(x.barcode) === String(searchBarcode)
);

if(item){

namaBarang = item.nama;

}

qty = qty.replace(",", ".");

let btn =
document.getElementById("btnKirim");

if(barcode === "" || qty === ""){

document.getElementById("status").innerHTML =
"⚠️ Barcode dan Qty wajib diisi";

return;

}

/* KUNCI TOMBOL AGAR TIDAK DOUBLE INPUT */

if(btn.disabled) return;

btn.disabled = true;
btn.innerHTML = "⏳ Mengirim...";

/* SIMPAN DATA INPUT */

const barcodeKirim = barcode;
const qtyKirim = qty;

/* LANGSUNG KOSONGKAN FORM */

document.getElementById("barcode").value = "";
document.getElementById("qty").value = "";

document.getElementById("namaBarang").style.display = "none";
document.getElementById("namaBarang").innerHTML = "";

hideSuggestions();

document.getElementById("status").innerHTML =
"⏳ Mengirim data...";

/* KIRIM DATA */

try{

const request = fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

barcode:barcodeKirim,
qty:qtyKirim

})

});

/*
JANGAN MENUNGGU LOAD HISTORY
*/

request.then(async res => {

document.getElementById("status").innerHTML =
"✅ Data berhasil dikirim";

/* UPDATE HISTORY DI BELAKANG */

loadHistory();

}).catch(err => {

document.getElementById("status").innerHTML =
"❌ Gagal mengirim data";

console.log(err);

})

.finally(()=>{

btn.disabled = false;
btn.innerHTML = "Kirim Data";

document.getElementById("barcode").focus();

});

}catch(err){

document.getElementById("status").innerHTML =
"❌ Gagal mengirim data";

console.log(err);

btn.disabled = false;
btn.innerHTML = "Kirim Data";

document.getElementById("barcode").focus();

}

}

/* BUKA MODAL */
function openPasswordModal(){

document.getElementById("passwordModal").style.display =
"flex";

setTimeout(()=>{

document.getElementById("adminPassword").focus();

},100);

}

/* TUTUP MODAL */
function closePasswordModal(){

document.getElementById("passwordModal").style.display =
"none";

document.getElementById("adminPassword").value = "";

}

/* ENTER PASSWORD */
document.addEventListener("keydown",function(e){

const modal =
document.getElementById("passwordModal");

if(modal.style.display === "flex"){

if(e.key === "Enter"){

submitReset();

}

if(e.key === "Escape"){

closePasswordModal();

}

}

});

/* RESET */
function resetData(){

openPasswordModal();

}

/* SUBMIT RESET */
function submitReset(){

let password =
document.getElementById("adminPassword").value;

if(password !== ADMIN_PASSWORD){

document.getElementById("status").innerHTML =
"❌ Password salah";

return;

}

closePasswordModal();

let konfirmasi = confirm(
"Yakin ingin menghapus semua data stockloss sebelumnya?"
);

if(!konfirmasi) return;

document.getElementById("status").innerHTML =
"⏳ Menghapus data...";

fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"reset",
password:password

})

})

.then(res => res.text())

.then(async data => {

document.getElementById("status").innerHTML =
"✅ Semua data stockloss sebelumnya berhasil dihapus";

await loadHistory();

document.getElementById("barcode").value = "";
document.getElementById("qty").value = "";

document.getElementById("namaBarang").style.display = "none";
document.getElementById("namaBarang").innerHTML = "";

document.getElementById("barcode").focus();

})

.catch(err => {

document.getElementById("status").innerHTML =
"❌ Gagal reset data";

console.log(err);

});

}

</script>

</body>
</html>
