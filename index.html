<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Viral Animated Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
      overflow: hidden;
      perspective: 1000px;
    }

    /* Animated Glow Wrapper */
    .card-wrapper {
      position: relative;
      padding: 3px;
      border-radius: 20px;
      background: linear-gradient(90deg, #ff007f, #7928ca, #0284c7, #ff007f);
      background-size: 300% 300%;
      animation: glowAnimation 4s linear infinite;
    }

    @keyframes glowAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Main Login Card */
    .login-card {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      width: 350px;
      border-radius: 17px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s ease-out;
      transform-style: preserve-3d;
    }

    .login-card h2 {
      color: #fff;
      text-align: center;
      margin-bottom: 24px;
      font-size: 28px;
    }

    /* Input Fields */
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      outline: none;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    /* Submit Button */
    .btn-login {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body>

  <div class="card-wrapper" id="wrapper">
    <div class="login-card" id="card">
      <h2>Welcome</h2>
      <form>
        <div class="input-group">
          <input type="email" placeholder="Email Address" required />
        </div>
        <div class="input-group">
          <input type="password" placeholder="Password" required />
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    const wrapper = document.getElementById('wrapper');
    const card = document.getElementById('card');

    /* 3D Tilt Effect on Mouse Move */
    document.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      wrapper.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    /* Reset Tilt Position on Mouse Leave */
    document.addEventListener('mouseleave', () => {
      wrapper.style.transform = 'rotateY(0deg) rotateX(0deg)';
    });
  </script>
</body>
</html>
