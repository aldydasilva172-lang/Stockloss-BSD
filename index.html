<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>STOCKLOSS BSD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:
linear-gradient(135deg,#0f172a,#111827,#1e293b);
overflow:hidden;
}

.container{
width:100%;
max-width:430px;
padding:35px;
border-radius:28px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.1);
}

.logo{
width:85px;
height:85px;
margin:auto;
margin-bottom:22px;
border-radius:24px;
display:flex;
justify-content:center;
align-items:center;
font-size:38px;
background:linear-gradient(135deg,#00f5ff,#7c3aed);
color:white;
font-weight:700;
}

h1{
text-align:center;
color:white;
font-size:30px;
margin-bottom:8px;
}

.desc{
text-align:center;
font-size:14px;
color:#cbd5e1;
margin-bottom:30px;
}

.input-box{
margin-bottom:20px;
position:relative;
}

.input-box label{
display:block;
margin-bottom:8px;
font-size:14px;
color:#f1f5f9;
}

.input-box input{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:16px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#00f5ff,#7c3aed);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
margin-top:10px;
}

.reset-btn{
background:linear-gradient(135deg,#ef4444,#dc2626);
}

.hasil-btn{
background:linear-gradient(135deg,#22c55e,#16a34a);
}

#status{
margin-top:18px;
text-align:center;
font-size:14px;
color:#cbd5e1;
min-height:20px;
}

#suggestions{
position:absolute;
top:100%;
left:0;
width:100%;
max-height:220px;
overflow-y:auto;
background:#0f172a;
border-radius:14px;
margin-top:6px;
z-index:99;
}

.suggest-item{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
}

.suggest-item:hover{
background:rgba(255,255,255,.08);
}

.suggest-barcode{
font-size:14px;
font-weight:600;
color:#00f5ff;
}

.suggest-name{
font-size:12px;
color:#cbd5e1;
margin-top:2px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">📦</div>

<h1>STOCKLOSS BSD</h1>

<p class="desc">
Input barcode dan qty stockloss
</p>

<div class="input-box">

<label>Barcode</label>

<input
type="text"
id="barcode"
placeholder="Scan / input barcode"
autocomplete="off"
>

<div id="suggestions"></div>

</div>

<div class="input-box">

<label>Qty</label>

<input
type="number"
step="0.01"
min="0"
id="qty"
placeholder="Masukkan Qty"
>

</div>

<button id="btnKirim">
Kirim Data
</button>

<button onclick="resetData()" class="reset-btn">
Reset Sheet SLT
</button>

<button onclick="bukaHasil()" class="hasil-btn">
📊 Hasil
</button>

<div id="status"></div>

</div>

<script>

let barcodeCache = [];

const URL_SCRIPT =
window.location.href;

/* ================================================= */
/* LOAD */
/* ================================================= */

window.onload = async () => {

document.getElementById("barcode")
.focus();

await loadBarcodeData();

};

function setStatus(msg){

document.getElementById("status")
.innerHTML = msg;

setTimeout(()=>{

document.getElementById("status")
.innerHTML = "";

},2000);

}

/* ================================================= */
/* LOAD BARCODE */
/* ================================================= */

async function loadBarcodeData(){

try{

setStatus(
"⏳ Memuat database barcode..."
);

const res = await fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"getAllBarcode"

})

});

barcodeCache =
await res.json();

setStatus(
"✅ Database barcode siap"
);

}catch(err){

setStatus(
"❌ Gagal memuat barcode"
);

}

}

/* ================================================= */
/* AUTOCOMPLETE */
/* ================================================= */

document
.getElementById("barcode")
.addEventListener("input",function(){

const keyword =
this.value.trim().toLowerCase();

const suggestions =
document.getElementById("suggestions");

if(keyword.length < 3){

suggestions.innerHTML = "";
return;

}

let filtered = [];

for(let item of barcodeCache){

const barcode =
String(item.barcode)
.toLowerCase();

const nama =
String(item.nama)
.toLowerCase();

if(
barcode.includes(keyword) ||
nama.includes(keyword)
){

filtered.push(item);

if(filtered.length >= 8)
break;

}

}

let html = "";

filtered.forEach(item=>{

html += `

<div class="suggest-item"
onclick="pilihBarcode('${item.barcode}')">

<div class="suggest-barcode">
${item.barcode}
</div>

<div class="suggest-name">
${item.nama}
</div>

</div>

`;

});

suggestions.innerHTML = html;

});

/* ================================================= */
/* PILIH BARCODE */
/* ================================================= */

function pilihBarcode(barcode){

document.getElementById("barcode")
.value = barcode;

document.getElementById("suggestions")
.innerHTML = "";

document.getElementById("qty")
.focus();

}

/* ================================================= */
/* ENTER */
/* ================================================= */

document
.getElementById("barcode")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

e.preventDefault();

document.getElementById("qty")
.focus();

}

});

document
.getElementById("qty")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

e.preventDefault();

kirimData();

}

});

/* ================================================= */
/* KIRIM */
/* ================================================= */

document
.getElementById("btnKirim")
.addEventListener("click", kirimData);

async function kirimData(){

const barcode =
document.getElementById("barcode")
.value.trim();

const qty =
document.getElementById("qty")
.value.trim();

if(barcode === "" || qty === ""){

setStatus(
"⚠️ Barcode dan Qty wajib diisi"
);

return;

}

try{

const res = await fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

barcode: barcode,
qty: qty

})

});

const result =
await res.text();

if(result !== "success"){

throw new Error();

}

setStatus(
"✅ Data berhasil dikirim"
);

document.getElementById("barcode")
.value = "";

document.getElementById("qty")
.value = "";

document.getElementById("barcode")
.focus();

}catch(err){

setStatus(
"❌ Gagal mengirim data"
);

}

}

/* ================================================= */
/* RESET */
/* ================================================= */

function resetData(){

const password =
prompt("Masukkan password admin");

if(password === null) return;

if(password !== "00"){

setStatus(
"❌ Password salah"
);

return;

}

const konfirmasi =
confirm(
"Yakin ingin reset data?"
);

if(!konfirmasi) return;

fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"reset",
password:password

})

})

.then(()=>{

setStatus(
"✅ Data berhasil direset"
);

})

.catch(()=>{

setStatus(
"❌ Gagal reset data"
);

});

}

/* ================================================= */
/* BUKA HASIL */
/* ================================================= */

function bukaHasil(){

window.open(

window.location.href +
"?page=hasil",

"_blank"

);

}

</script>

</body>
</html>
