<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STOCKLOSS BSD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:
linear-gradient(135deg,#0f172a,#111827,#1e293b);
overflow:hidden;
}
/* TAMBAHKAN DI SINI */

html,body{

overscroll-behavior:none;

}

body::before{
content:'';
position:absolute;
width:350px;
height:350px;
background:#00f5ff;
border-radius:50%;
top:-120px;
left:-120px;
filter:blur(120px);
opacity:.25;
}

body::after{
content:'';
position:absolute;
width:300px;
height:300px;
background:#7c3aed;
border-radius:50%;
bottom:-120px;
right:-120px;
filter:blur(120px);
opacity:.25;
}

.container{
position:relative;
z-index:2;
width:100%;
max-width:430px;
padding:35px;
border-radius:28px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.1);
box-shadow:
0 10px 40px rgba(0,0,0,.35);
}

.logo{
width:85px;
height:85px;
margin:auto;
margin-bottom:22px;
border-radius:24px;
display:flex;
justify-content:center;
align-items:center;
font-size:38px;
background:linear-gradient(135deg,#00f5ff,#7c3aed);
color:white;
font-weight:700;
}

h1{
text-align:center;
color:white;
font-size:30px;
font-weight:700;
margin-bottom:8px;
}

.desc{
text-align:center;
font-size:14px;
color:#cbd5e1;
margin-bottom:30px;
}

.input-box{
margin-bottom:20px;
position:relative;
}

.input-box label{
display:block;
margin-bottom:8px;
font-size:14px;
color:#f1f5f9;
}

.input-box input{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:16px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
border:1px solid transparent;
transition:.3s;
}

.input-box input:focus{
border:1px solid #00f5ff;
box-shadow:0 0 15px rgba(0,245,255,.25);
}

input::placeholder{
color:#94a3b8;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#00f5ff,#7c3aed);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

button:disabled{
opacity:.7;
}

.reset-btn{
margin-top:12px;
background:linear-gradient(135deg,#ef4444,#dc2626);
}

#status{
margin-top:18px;
text-align:center;
font-size:14px;
color:#cbd5e1;
min-height:20px;
}

#suggestions{
position:absolute;
top:100%;
left:6px;
width:calc(100% - 12px);
max-height:220px;
overflow-y:auto;
background:#0f172a;
border-radius:14px;
margin-top:6px;
z-index:99;
box-shadow:0 10px 25px rgba(0,0,0,.4);
}
/* TAMBAHAN */

-webkit-overflow-scrolling: touch;

touch-action: pan-y;

overscroll-behavior: contain;

}

.suggest-item{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
transition:.2s;
}

.suggest-item:hover{
background:rgba(255,255,255,.08);
}

.suggest-barcode{
font-size:14px;
font-weight:600;
color:#00f5ff;
}

.suggest-name{
font-size:12px;
color:#cbd5e1;
margin-top:2px;
}

@media(max-width:500px){

.container{
padding:28px;
}

h1{
font-size:24px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="logo">🐷</div>

<h1>STOCKLOSS BSD</h1>

<p class="desc">
Input Barcode dan Qty Stockloss
</p>

<div class="input-box">

<label>Barcode</label>

<input 
type="text" 
id="barcode" 
placeholder="Scan / Input Barcode"
autocomplete="off"
>

<div id="suggestions"></div>

</div>

<div class="input-box">

<label>Qty</label>

<input 
type="text"
inputmode="decimal"
id="qty" 
placeholder="Masukkan Qty"
>

</div>

<button id="btnKirim" onclick="kirimData()">
Kirim Data
</button>

<button onclick="resetData()" class="reset-btn">
Reset Sheet SLT
</button>

<div id="status"></div>

</div>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyYp-CRc2wUKF-OQ8VFb3NApejjOSpIDbdlVxcsvgDtY8YHEwGdysxaHU1ruQATXOIS-w/exec";

const ADMIN_PASSWORD = "00";

let barcodeCache = [];
let debounceTimer;

/* AUTO FOCUS */
window.onload = async () => {

document.getElementById("barcode").focus();

await loadBarcodeData();

};

/* LOAD DATA BARCODE */
async function loadBarcodeData(){

try{

const res = await fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"getAllBarcode"

})

});

barcodeCache = await res.json();

console.log(
"Loaded:",
barcodeCache.length
);

}catch(err){

console.log(err);

}

}

/* AUTOCOMPLETE */
document
.getElementById("barcode")
.addEventListener("input", function(e){

e.stopPropagation();

clearTimeout(debounceTimer);

debounceTimer = setTimeout(() => {

let keyword =
this.value.trim().toLowerCase();

const suggestions =
document.getElementById("suggestions");

if(keyword.length < 3){

suggestions.innerHTML = "";
return;

}

let filtered = barcodeCache.filter(item => {

let barcode =
String(item.barcode).toLowerCase();

let nama =
String(item.nama).toLowerCase();

return (

barcode.startsWith(keyword) ||

barcode.includes(keyword) ||

nama.includes(keyword)

);

});

filtered.sort((a,b)=>{

let aBarcode =
String(a.barcode).toLowerCase();

let bBarcode =
String(b.barcode).toLowerCase();

if(aBarcode === keyword) return -1;
if(bBarcode === keyword) return 1;

if(aBarcode.startsWith(keyword) &&
!bBarcode.startsWith(keyword)) return -1;

if(bBarcode.startsWith(keyword) &&
!aBarcode.startsWith(keyword)) return 1;

return aBarcode.length - bBarcode.length;

});

if(filtered.length === 0){

suggestions.innerHTML = "";
return;

}

filtered = filtered.slice(0,20);

let html = "";

filtered.forEach(item => {

html += `

<div class="suggest-item"
onclick="pilihBarcode('${item.barcode}')">

<div class="suggest-barcode">
${item.barcode}
</div>

<div class="suggest-name">
${item.nama}
</div>

</div>

`;

});

suggestions.innerHTML = html;

},120);

});

/* HIDE */
document.addEventListener("click",function(e){

if(!e.target.closest(".input-box")){

document.getElementById("suggestions").innerHTML =
"";

}

});

/* PILIH */
function pilihBarcode(barcode){

document.getElementById("barcode").value =
barcode;

document.getElementById("suggestions").innerHTML =
"";

document.getElementById("qty").focus();

}

/* ENTER */
document.getElementById("barcode")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

e.preventDefault();

document.getElementById("qty").focus();

}

});

document.getElementById("qty")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){

e.preventDefault();

kirimData();

}

});

/* KIRIM */
async function kirimData(){

let barcode =
document.getElementById("barcode").value.trim();

let qty =
document.getElementById("qty").value.trim();

let btn =
document.getElementById("btnKirim");

if(barcode === "" || qty === ""){

document.getElementById("status").innerHTML =
"⚠️ Barcode dan Qty wajib diisi";

return;

}

btn.disabled = true;
btn.innerHTML = "⏳ Mengirim...";

document.getElementById("barcode").value = "";
document.getElementById("qty").value = "";
document.getElementById("suggestions").innerHTML = "";

document.getElementById("barcode").focus();

document.getElementById("status").innerHTML =
"⏳ Mengirim data...";

try{

await fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

barcode:barcode,
qty:qty

})

});

document.getElementById("status").innerHTML =
"✅ Data berhasil dikirim";

}catch(err){

document.getElementById("status").innerHTML =
"❌ Gagal mengirim data";

console.log(err);

}finally{

btn.disabled = false;
btn.innerHTML = "Kirim Data";

}

}

/* RESET */
function resetData(){

let password = prompt(
"Masukkan password admin"
);

if(password === null) return;

if(password !== ADMIN_PASSWORD){

document.getElementById("status").innerHTML =
"❌ Password admin salah";

return;

}

let konfirmasi = confirm(
"Yakin ingin menghapus semua data sheet SLT?"
);

if(!konfirmasi) return;

document.getElementById("status").innerHTML =
"⏳ Menghapus data...";

fetch(URL_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"reset",
password:password

})

})

.then(res => res.text())

.then(data => {

document.getElementById("status").innerHTML =
"✅ Semua data sheet SLT berhasil dihapus";

document.getElementById("barcode").focus();

})

.catch(err => {

document.getElementById("status").innerHTML =
"❌ Gagal reset data";

console.log(err);

});

}

</script>

</body>
</html>
